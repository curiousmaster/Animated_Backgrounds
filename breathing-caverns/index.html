<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Breathing Caverns</title>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #060910;
    }

    #background {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <canvas id="background" aria-hidden="true"></canvas>

  <script type="module">
    const config = {
      cavern: {
        layers: 9,
        opening: 0.17,
        depth: 0.085,
        irregularity: 0.14,
        detail: 7,
        rotation: 0,
        ellipticity: 0.75
      },

      breathing: {
        enabled: true,
        speed: 0.35,
        amplitude: 0.035,
        phaseDelay: 0.32,
        drift: 0.018
      },

      mouse: {
        enabled: true,
        parallax: 55,
        smoothing: 5,
        lightStrength: 0.7
      },

      appearance: {
        backgroundColor: [6, 9, 16],
        nearColor: [25, 39, 52],
        farColor: [10, 20, 30],
        edgeColorA: [87, 177, 181],
        edgeColorB: [148, 112, 179],
        edgeOpacity: 0.3,
        edgeWidth: 1,
        glow: 12,
        ambientLight: 0.28
      },

      animation: {
        speed: 1,
        paused: false,
        respectReducedMotion: true
      },

      panel: {
        enabled: true
      }
    };

    const canvas = document.querySelector("#background");
    const ctx = canvas.getContext("2d");
    const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)");

    let width = 1;
    let height = 1;
    let time = 0;
    let previous = null;
    let seed = Math.random() * 1000;

    const mouse = {
      x: 0,
      y: 0,
      targetX: 0,
      targetY: 0,
      active: false,
      influence: 0
    };

    const clamp = (value, min, max) =>
      Math.max(min, Math.min(max, value));

    const rgba = (color, alpha = 1) =>
      `rgba(${color.join(",")},${clamp(alpha, 0, 1)})`;

    function mix(a, b, amount) {
      return a.map((value, i) =>
        Math.round(value + (b[i] - value) * amount)
      );
    }

    function reset() {
      seed = Math.random() * 1000;
    }

    function resize() {
      width = innerWidth;
      height = innerHeight;

      const dpr = Math.min(devicePixelRatio || 1, 2);

      canvas.width = Math.round(width * dpr);
      canvas.height = Math.round(height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function terrain(angle, layer) {
      const detail = Math.round(config.cavern.detail);

      // A shared contour keeps adjacent walls visually related.
      const broad =
        Math.sin(angle * 3 + seed) * 0.48 +
        Math.cos(angle * 5 - seed * 0.37) * 0.27;

      const fine =
        Math.sin(
          angle * detail +
          seed * 0.13 +
          layer * 0.18
        ) * 0.16 +
        Math.cos(
          angle * (detail + 4) -
          seed * 0.21 +
          layer * 0.12
        ) * 0.09;

      return broad + fine;
    }

    function createOpening(layer) {
      const count = Math.round(config.cavern.layers);
      const depth = count <= 1 ? 0 : layer / (count - 1);
      const base = Math.min(width, height);

      const breathingTime =
        time * config.breathing.speed * Math.PI * 2;

      const breath = config.breathing.enabled
        ? Math.sin(
            breathingTime -
            layer * config.breathing.phaseDelay
          ) * config.breathing.amplitude
        : 0;

      const drift = config.breathing.enabled
        ? config.breathing.drift
        : 0;

      // Layer 0 is the smallest, deepest opening.
      const radius = base * Math.max(
        0.03,
        config.cavern.opening +
        layer * config.cavern.depth +
        breath
      );

      const parallax =
        config.mouse.parallax *
        (0.12 + depth * depth * 0.88) *
        mouse.influence;

      const centerX =
        width / 2 +
        mouse.x * parallax +
        Math.sin(breathingTime * 0.27 - layer * 0.15) *
        base * drift;

      const centerY =
        height / 2 +
        mouse.y * parallax +
        Math.cos(breathingTime * 0.21 - layer * 0.12) *
        base * drift * 0.65;

      const rotation = config.cavern.rotation * Math.PI / 180;
      const cosRotation = Math.cos(rotation);
      const sinRotation = Math.sin(rotation);

      const points = [];
      const samples = 240;

      for (let i = 0; i < samples; i++) {
        const angle = i / samples * Math.PI * 2;

        const contourRadius = radius * (
          1 +
          terrain(angle, layer) * config.cavern.irregularity
        );

        const localX = Math.cos(angle) * contourRadius;
        const localY =
          Math.sin(angle) *
          contourRadius *
          config.cavern.ellipticity;

        points.push({
          x: centerX +
            localX * cosRotation -
            localY * sinRotation,

          y: centerY +
            localX * sinRotation +
            localY * cosRotation
        });
      }

      return { points, centerX, centerY, radius, depth };
    }

    function openingPath(points) {
      const path = new Path2D();

      path.moveTo(points[0].x, points[0].y);

      for (let i = 1; i < points.length; i++) {
        path.lineTo(points[i].x, points[i].y);
      }

      path.closePath();
      return path;
    }

    function wallPath(points) {
      const path = new Path2D();

      path.rect(-2, -2, width + 4, height + 4);
      path.moveTo(points[0].x, points[0].y);

      for (let i = 1; i < points.length; i++) {
        path.lineTo(points[i].x, points[i].y);
      }

      path.closePath();
      return path;
    }

    function drawWall(layer) {
      const opening = createOpening(layer);
      const {
        points,
        centerX,
        centerY,
        radius,
        depth
      } = opening;

      const wall = wallPath(points);
      const edge = openingPath(points);

      const wallColor = mix(
        config.appearance.farColor,
        config.appearance.nearColor,
        depth
      );

      // The even-odd rule cuts a transparent opening in each wall.
      ctx.fillStyle = rgba(wallColor);
      ctx.fill(wall, "evenodd");

      const lightX =
        width * 0.33 +
        mouse.x * width * 0.2 *
        mouse.influence *
        config.mouse.lightStrength;

      const lightY =
        height * 0.22 +
        mouse.y * height * 0.2 *
        mouse.influence *
        config.mouse.lightStrength;

      const edgeColor = mix(
        config.appearance.edgeColorA,
        config.appearance.edgeColorB,
        depth
      );

      ctx.save();
      ctx.clip(wall, "evenodd");

      const wash = ctx.createRadialGradient(
        lightX,
        lightY,
        0,
        lightX,
        lightY,
        Math.hypot(width, height) * 0.85
      );

      wash.addColorStop(
        0,
        rgba(
          edgeColor,
          config.appearance.ambientLight *
          (0.12 + depth * 0.18)
        )
      );

      wash.addColorStop(1, rgba(edgeColor, 0));

      ctx.fillStyle = wash;
      ctx.fillRect(0, 0, width, height);

      // Keep the glow on the wall side of the opening.
      ctx.strokeStyle = rgba(
        edgeColor,
        config.appearance.edgeOpacity *
        (0.45 + depth * 0.55)
      );

      ctx.lineWidth = config.appearance.edgeWidth;
      ctx.shadowColor = rgba(edgeColor);
      ctx.shadowBlur = config.appearance.glow;
      ctx.stroke(edge);

      ctx.restore();

      // A softly varying highlight gives each rim a sense of relief.
      const highlight = ctx.createLinearGradient(
        centerX - radius,
        centerY - radius,
        centerX + radius,
        centerY + radius
      );

      highlight.addColorStop(
        0,
        rgba(edgeColor, config.appearance.edgeOpacity)
      );

      highlight.addColorStop(
        0.45,
        rgba(edgeColor, config.appearance.edgeOpacity * 0.35)
      );

      highlight.addColorStop(
        1,
        rgba(edgeColor, config.appearance.edgeOpacity * 0.06)
      );

      ctx.strokeStyle = highlight;
      ctx.lineWidth = config.appearance.edgeWidth;
      ctx.stroke(edge);
    }

    function frame(timestamp) {
      const realDt = previous === null
        ? 0
        : Math.min((timestamp - previous) / 1000, 0.05);

      previous = timestamp;

      const still =
        config.animation.paused ||
        (
          config.animation.respectReducedMotion &&
          reducedMotion.matches
        );

      const dt = still ? 0 : realDt * config.animation.speed;
      time += dt;

      const smoothing =
        1 - Math.exp(-config.mouse.smoothing * realDt);

      mouse.x += (mouse.targetX - mouse.x) * smoothing;
      mouse.y += (mouse.targetY - mouse.y) * smoothing;

      const targetInfluence =
        config.mouse.enabled && mouse.active ? 1 : 0;

      mouse.influence +=
        (targetInfluence - mouse.influence) * smoothing;

      ctx.shadowBlur = 0;
      ctx.fillStyle = rgba(config.appearance.backgroundColor);
      ctx.fillRect(0, 0, width, height);

      // Paint from the deepest wall toward the viewer.
      const count = Math.round(config.cavern.layers);

      for (let layer = 0; layer < count; layer++) {
        drawWall(layer);
      }

      requestAnimationFrame(frame);
    }

    function updatePointer(event) {
      if (event.target.closest?.("[data-background-editor]")) {
        mouse.active = false;
        return;
      }

      mouse.targetX = clamp(
        (event.clientX / width - 0.5) * 2,
        -1,
        1
      );

      mouse.targetY = clamp(
        (event.clientY / height - 0.5) * 2,
        -1,
        1
      );

      mouse.active = true;
    }

    addEventListener("pointermove", updatePointer);
    addEventListener("pointerdown", updatePointer);

    addEventListener("pointerup", event => {
      if (event.pointerType !== "mouse") {
        mouse.active = false;
      }
    });

    addEventListener("pointercancel", () => {
      mouse.active = false;
    });

    document.documentElement.addEventListener("pointerleave", () => {
      mouse.active = false;
    });

    addEventListener("blur", () => {
      mouse.active = false;
    });

    document.addEventListener("visibilitychange", () => {
      previous = null;
      mouse.active = false;
    });

    addEventListener("resize", resize);

    resize();
    requestAnimationFrame(frame);

    if (config.panel.enabled) {
      import("./settings-editor.js")
        .then(({ createSettingsEditor }) => {
          createSettingsEditor({
            config,
            onReset: reset
          });
        })
        .catch(error => {
          console.error("Editor could not load:", error);
        });
    }
  </script>
</body>
</html>
