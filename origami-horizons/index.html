<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Origami Horizons</title>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #090e1c;
    }

    #background {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <canvas id="background" aria-hidden="true"></canvas>

  <script type="module">
    const config = {
      folds: {
        columns: 22,
        rows: 18,
        height: 95,
        speed: 0.35,
        irregularity: 0.3
      },

      perspective: {
        tilt: 55,
        distance: 1100,
        scale: 1.15,
        verticalOffset: 70
      },

      mouse: {
        enabled: true,
        radius: 200,
        lift: 140,
        smoothing: 6
      },

      appearance: {
        backgroundColor: [9, 14, 28],
        colorA: [63, 133, 159],
        colorB: [150, 102, 169],
        highlightColor: [199, 221, 226],
        opacity: 0.28,
        edgeOpacity: 0.25,
        edgeWidth: 0.7,
        lighting: 0.75,
        lightDirection: -35
      },

      animation: {
        speed: 1,
        paused: false,
        respectReducedMotion: true
      },

      panel: {
        enabled: true
      }
    };

    window.getBackgroundConfig = () =>
      JSON.parse(JSON.stringify(config));

    const canvas = document.querySelector("#background");
    const ctx = canvas.getContext("2d");
    const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)");

    let width = 1;
    let height = 1;
    let vertices = [];
    let faces = [];
    let meshKey = "";
    let previous = null;
    let time = 0;

    const mouse = {
      x: 0,
      y: 0,
      targetX: 0,
      targetY: 0,
      active: false,
      influence: 0
    };

    const clamp = (value, min, max) => Math.max(min, Math.min(max, value));
    const radians = degrees => degrees * Math.PI / 180;

    const rgba = (color, alpha = 1) =>
      `rgba(${color.join(",")},${clamp(alpha, 0, 1)})`;

    function mix(a, b, amount) {
      return a.map((value, index) =>
        Math.round(value + (b[index] - value) * amount)
      );
    }

    function buildMesh() {
      vertices = [];
      faces = [];

      const columns = Math.round(config.folds.columns);
      const rows = Math.round(config.folds.rows);

      for (let row = 0; row <= rows; row++) {
        for (let column = 0; column <= columns; column++) {
          const boundary =
            row === 0 || row === rows ||
            column === 0 || column === columns;

          vertices.push({
            u: column / columns,
            v: row / rows,
            jitterX: boundary ? 0 : Math.random() - 0.5,
            jitterY: boundary ? 0 : Math.random() - 0.5,
            phase: Math.random() * Math.PI * 2,
            parity: (row + column) % 2 ? 1 : -1,
            lift: 0
          });
        }
      }

      for (let row = 0; row < rows; row++) {
        for (let column = 0; column < columns; column++) {
          const a = row * (columns + 1) + column;
          const b = a + 1;
          const c = a + columns + 1;
          const d = c + 1;

          if ((row + column) % 2) {
            faces.push([a, b, c], [b, d, c]);
          } else {
            faces.push([a, b, d], [a, d, c]);
          }
        }
      }

      meshKey = `${columns}:${rows}`;
    }

    function refresh() {
      const key =
        `${Math.round(config.folds.columns)}:` +
        `${Math.round(config.folds.rows)}`;

      if (key !== meshKey) buildMesh();
    }

    function resize() {
      width = innerWidth;
      height = innerHeight;

      const dpr = Math.min(devicePixelRatio || 1, 2);
      canvas.width = Math.round(width * dpr);
      canvas.height = Math.round(height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function project(x, y, z) {
      const tilt = radians(config.perspective.tilt);
      const rotatedY = y * Math.cos(tilt) - z * Math.sin(tilt);
      const depth = y * Math.sin(tilt) + z * Math.cos(tilt);

      // Positive depth points toward the viewer.
      const distance = config.perspective.distance;
      const factor =
        distance / Math.max(distance * 0.25, distance - depth);

      return {
        x: width / 2 + x * factor * config.perspective.scale,
        y: height / 2 +
          config.perspective.verticalOffset +
          rotatedY * factor * config.perspective.scale,
        depth
      };
    }

    function updateVertices(interactionDt) {
      const columns = Math.round(config.folds.columns);
      const rows = Math.round(config.folds.rows);

      const spanX = width * 1.5;
      const spanY = Math.max(height * 1.6, width * 0.85);

      const smoothing =
        1 - Math.exp(-config.mouse.smoothing * interactionDt);

      return vertices.map(vertex => {
        const x = (
          vertex.u - 0.5 +
          vertex.jitterX * config.folds.irregularity / columns
        ) * spanX;

        const y = (
          vertex.v - 0.5 +
          vertex.jitterY * config.folds.irregularity / rows
        ) * spanY;

        const clock = time * config.folds.speed;

        const ridge =
          vertex.parity *
          (0.55 + Math.sin(clock + vertex.u * 4 + vertex.v * 3) * 0.25);

        const wave =
          Math.sin(
            vertex.u * Math.PI * 3 -
            vertex.v * Math.PI * 2 +
            clock * 0.7
          ) * 0.25;

        const detail =
          Math.sin(clock * 0.45 + vertex.phase) *
          config.folds.irregularity * 0.15;

        const baseZ =
          (ridge + wave + detail) * config.folds.height;

        // Test proximity against the unlifted surface to avoid feedback.
        const baseProjection = project(x, y, baseZ);

        const distance = Math.hypot(
          baseProjection.x - mouse.x,
          baseProjection.y - mouse.y
        );

        const proximity = clamp(
          1 - distance / config.mouse.radius,
          0,
          1
        );

        const targetLift = config.mouse.enabled
          ? proximity * proximity *
            config.mouse.lift * mouse.influence
          : 0;

        vertex.lift += (targetLift - vertex.lift) * smoothing;

        const z = baseZ + vertex.lift;

        return {
          x,
          y,
          z,
          screen: project(x, y, z),
          tint: vertex.v
        };
      });
    }

    function faceLighting(a, b, c) {
      const ux = b.x - a.x;
      const uy = b.y - a.y;
      const uz = b.z - a.z;

      const vx = c.x - a.x;
      const vy = c.y - a.y;
      const vz = c.z - a.z;

      let nx = uy * vz - uz * vy;
      let ny = uz * vx - ux * vz;
      let nz = ux * vy - uy * vx;

      if (nz < 0) {
        nx = -nx;
        ny = -ny;
        nz = -nz;
      }

      const length = Math.hypot(nx, ny, nz) || 1;
      const angle = radians(config.appearance.lightDirection);

      const lx = Math.cos(angle) * 0.65;
      const ly = Math.sin(angle) * 0.65;
      const lz = Math.sqrt(1 - 0.65 * 0.65);

      return clamp(
        (nx * lx + ny * ly + nz * lz) / length,
        0,
        1
      );
    }

    function drawMesh(points) {
      const sortedFaces = faces.map(indices => {
        const [a, b, c] = indices.map(index => points[index]);

        return {
          a,
          b,
          c,
          depth:
            (a.screen.depth + b.screen.depth + c.screen.depth) / 3
        };
      });

      sortedFaces.sort((a, b) => a.depth - b.depth);

      ctx.lineJoin = "round";
      ctx.lineWidth = config.appearance.edgeWidth;

      for (const face of sortedFaces) {
        const { a, b, c } = face;
        const light = faceLighting(a, b, c);
        const tint = (a.tint + b.tint + c.tint) / 3;

        const baseColor = mix(
          config.appearance.colorA,
          config.appearance.colorB,
          tint
        );

        const color = mix(
          baseColor,
          config.appearance.highlightColor,
          light * config.appearance.lighting * 0.65
        );

        ctx.beginPath();
        ctx.moveTo(a.screen.x, a.screen.y);
        ctx.lineTo(b.screen.x, b.screen.y);
        ctx.lineTo(c.screen.x, c.screen.y);
        ctx.closePath();

        ctx.fillStyle = rgba(
          color,
          config.appearance.opacity * (0.5 + light * 0.5)
        );
        ctx.fill();

        ctx.strokeStyle = rgba(
          color,
          config.appearance.edgeOpacity * (0.35 + light * 0.65)
        );
        ctx.stroke();
      }
    }

    function frame(timestamp) {
      const realDt = previous === null
        ? 0
        : Math.min((timestamp - previous) / 1000, 0.05);

      previous = timestamp;

      const still =
        config.animation.paused ||
        (
          config.animation.respectReducedMotion &&
          reducedMotion.matches
        );

      if (!still) time += realDt * config.animation.speed;

      const smoothing =
        1 - Math.exp(-config.mouse.smoothing * realDt);

      mouse.x += (mouse.targetX - mouse.x) * smoothing;
      mouse.y += (mouse.targetY - mouse.y) * smoothing;

      mouse.influence +=
        ((mouse.active ? 1 : 0) - mouse.influence) * smoothing;

      ctx.fillStyle = rgba(config.appearance.backgroundColor);
      ctx.fillRect(0, 0, width, height);

      drawMesh(updateVertices(realDt));

      requestAnimationFrame(frame);
    }

    function updatePointer(event) {
      if (event.target.closest?.("[data-background-editor]")) {
        mouse.active = false;
        return;
      }

      if (!mouse.active) {
        mouse.x = event.clientX;
        mouse.y = event.clientY;
      }

      mouse.targetX = event.clientX;
      mouse.targetY = event.clientY;
      mouse.active = true;
    }

    addEventListener("pointermove", updatePointer);
    addEventListener("pointerdown", updatePointer);

    addEventListener("pointerup", event => {
      if (event.pointerType !== "mouse") mouse.active = false;
    });

    addEventListener("pointercancel", () => mouse.active = false);
    addEventListener("blur", () => mouse.active = false);

    document.documentElement.addEventListener(
      "pointerleave",
      () => mouse.active = false
    );

    document.addEventListener("visibilitychange", () => {
      previous = null;
      mouse.active = false;
    });

    addEventListener("resize", resize);

    resize();
    buildMesh();
    requestAnimationFrame(frame);

    if (config.panel.enabled) {
      import("./settings-editor.js")
        .then(({ createSettingsEditor }) => {
          createSettingsEditor({
            config,
            onChange: refresh,
            onReset: buildMesh
          });
        })
        .catch(error => console.error("Editor could not load:", error));
    }
  </script>
</body>
</html>
