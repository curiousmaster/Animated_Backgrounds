<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Topographic Contours</title>

<style>
    html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
    }

    canvas {
        display: block;
        width: 100%;
        height: 100%;
    }
</style>
</head>

<body>
<canvas id="background" aria-hidden="true"></canvas>

<script type="module">
"use strict";

// Replace with configuration copied from the editor.
const config = {
    terrain: {
        scale: 230,           // Larger = wider terrain features
        amplitude: 1,
        speed: 0.18,
        detail: 0.35,
        rotation: 0
    },

    contours: {
        interval: 0.12,        // Elevation between contour lines
        lineWidth: 1,
        opacity: 0.65,
        color: [100, 190, 255],
        majorEvery: 5,         // Every fifth contour is emphasized
        majorWidth: 1.8
    },

    mouse: {
        enabled: true,
        mode: "hill",          // "hill" or "depression"
        radius: 180,
        strength: 0.9,
        smoothing: 8,
        color: [255, 100, 170]
    },

    glow: {
        enabled: true,
        intensity: 0.5,
        blur: 8
    },

    resolution: 14,            // Sampling spacing; lower = finer
    panel: {
        enabled: true
    }
};

const canvas = document.getElementById("background");
const ctx = canvas.getContext("2d");

const clamp = (value, min, max) =>
    Math.max(min, Math.min(max, value));

function rgb(color) {
    return `rgb(${color.map(value =>
        Math.round(clamp(value, 0, 255))
    ).join(",")})`;
}

function mixColor(a, b, amount) {
    const t = clamp(amount, 0, 1);

    return a.map((value, index) =>
        value + (b[index] - value) * t
    );
}

let width = 0;
let height = 0;
let columns = 0;
let rows = 0;
let cellSize = 14;
let values = new Float32Array(0);

let time = 0;
let previousTime = null;
let gridDirty = true;

const mouse = {
    x: 0,
    y: 0,
    targetX: 0,
    targetY: 0,
    active: false,
    initialized: false,
    influence: 0
};

function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);

    width = window.innerWidth;
    height = window.innerHeight;

    canvas.width = Math.round(width * dpr);
    canvas.height = Math.round(height * dpr);

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    gridDirty = true;
}

function rebuildGrid() {
    cellSize = Math.max(4, config.resolution);
    columns = Math.ceil(width / cellSize) + 1;
    rows = Math.ceil(height / cellSize) + 1;

    values = new Float32Array(columns * rows);
}

// --------------------------------------------------
// Terrain field
// --------------------------------------------------

function sampleTerrain() {
    const scale = Math.max(10, config.terrain.scale);
    const amplitude = Math.max(0, config.terrain.amplitude);
    const detail = Math.max(0, config.terrain.detail);

    const angle = config.terrain.rotation * Math.PI / 180;
    const cos = Math.cos(angle);
    const sin = Math.sin(angle);

    const radius = Math.max(1, config.mouse.radius);
    const mouseSign = config.mouse.mode === "depression" ? -1 : 1;
    const mouseStrength =
        config.mouse.enabled
            ? mouse.influence * config.mouse.strength * mouseSign
            : 0;

    let minimum = Infinity;
    let maximum = -Infinity;

    for (let row = 0; row < rows; row++) {
        const screenY = row * cellSize;

        for (let column = 0; column < columns; column++) {
            const screenX = column * cellSize;

            const px = (screenX - width / 2) / scale;
            const py = (screenY - height / 2) / scale;

            const x = px * cos - py * sin;
            const y = px * sin + py * cos;

            // Smooth domain warping makes irregular terrain.
            const u = x + 0.5 * Math.sin(y * 0.8 + time * 0.6);
            const v = y + 0.5 * Math.cos(x * 0.7 - time * 0.5);

            let elevation = amplitude * (
                0.55 * Math.sin(u * 1.15 + time) +
                0.4 * Math.cos(v * 1.35 - time * 0.7) +
                0.25 * Math.sin(u * 0.7 + v * 0.9 + time * 0.4) +
                detail * (
                    0.3 * Math.sin(u * 2.8 - v * 1.7 + time * 0.8) +
                    0.2 * Math.cos(v * 3.2 + u * 1.3 - time * 0.9)
                )
            );

            if (Math.abs(mouseStrength) > 0.0001) {
                const dx = screenX - mouse.x;
                const dy = screenY - mouse.y;

                elevation += mouseStrength * Math.exp(
                    -(dx * dx + dy * dy) /
                    (2 * radius * radius)
                );
            }

            values[row * columns + column] = elevation;

            minimum = Math.min(minimum, elevation);
            maximum = Math.max(maximum, elevation);
        }
    }

    return { minimum, maximum };
}

// --------------------------------------------------
// Contours using marching squares
// --------------------------------------------------

// Edge numbering:
// 0: top, 1: right, 2: bottom, 3: left.
//
// Corner bits:
// top-left 1, top-right 2, bottom-right 4, bottom-left 8.

const edgePairs = {
    1:  [3, 0],
    2:  [0, 1],
    3:  [3, 1],
    4:  [1, 2],
    6:  [0, 2],
    7:  [3, 2],
    8:  [2, 3],
    9:  [0, 2],
    11: [1, 2],
    12: [1, 3],
    13: [0, 1],
    14: [3, 0]
};

function buildContour(level) {
    const path = new Path2D();

    for (let row = 0; row < rows - 1; row++) {
        for (let column = 0; column < columns - 1; column++) {
            const index = row * columns + column;

            const a = values[index];
            const b = values[index + 1];
            const c = values[index + columns + 1];
            const d = values[index + columns];

            const mask =
                (a > level ? 1 : 0) |
                (b > level ? 2 : 0) |
                (c > level ? 4 : 0) |
                (d > level ? 8 : 0);

            if (mask === 0 || mask === 15) continue;

            let pairs = edgePairs[mask];

            if (mask === 5 || mask === 10) {
                // Resolve saddle cells using the bilinear field.
                const determinant =
                    (a - level) * (c - level) -
                    (b - level) * (d - level);

                pairs = determinant >= 0
                    ? [0, 1, 2, 3]
                    : [3, 0, 1, 2];
            }

            const x = column * cellSize;
            const y = row * cellSize;

            function fraction(start, end) {
                const difference = end - start;

                return difference === 0
                    ? 0.5
                    : clamp((level - start) / difference, 0, 1);
            }

            function edgePoint(edge) {
                switch (edge) {
                    case 0:
                        return [
                            x + fraction(a, b) * cellSize,
                            y
                        ];

                    case 1:
                        return [
                            x + cellSize,
                            y + fraction(b, c) * cellSize
                        ];

                    case 2:
                        return [
                            x + fraction(d, c) * cellSize,
                            y + cellSize
                        ];

                    default:
                        return [
                            x,
                            y + fraction(a, d) * cellSize
                        ];
                }
            }

            for (let i = 0; i < pairs.length; i += 2) {
                const start = edgePoint(pairs[i]);
                const end = edgePoint(pairs[i + 1]);

                path.moveTo(start[0], start[1]);
                path.lineTo(end[0], end[1]);
            }
        }
    }

    return path;
}

function strokeContour(path, lineWidth) {
    if (config.glow.enabled && config.glow.intensity > 0) {
        ctx.save();

        ctx.globalAlpha =
            config.contours.opacity *
            clamp(config.glow.intensity, 0, 1);

        ctx.shadowColor = rgb(config.contours.color);
        ctx.shadowBlur = Math.max(0, config.glow.blur);
        ctx.lineWidth = lineWidth;
        ctx.stroke(path);

        ctx.restore();
    }

    ctx.globalAlpha = clamp(config.contours.opacity, 0, 1);
    ctx.lineWidth = lineWidth;
    ctx.stroke(path);
}

function drawContours(minimum, maximum) {
    const interval = Math.max(0.02, config.contours.interval);
    const majorEvery = Math.max(
        1, Math.floor(config.contours.majorEvery)
    );

    // Integer indices keep contour elevations anchored.
    const first = Math.ceil(minimum / interval);
    const last = Math.floor(maximum / interval);

    let stroke = rgb(config.contours.color);

    if (
        config.mouse.enabled &&
        mouse.influence > 0.001 &&
        config.mouse.strength > 0
    ) {
        const radius = Math.max(1, config.mouse.radius);
        const gradient = ctx.createRadialGradient(
            mouse.x, mouse.y, 0,
            mouse.x, mouse.y, radius * 2.5
        );

        gradient.addColorStop(0, rgb(mixColor(
            config.contours.color,
            config.mouse.color,
            mouse.influence
        )));

        gradient.addColorStop(1, rgb(config.contours.color));
        stroke = gradient;
    }

    ctx.strokeStyle = stroke;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";

    for (let index = first; index <= last; index++) {
        const major = index % majorEvery === 0;

        const lineWidth = major
            ? config.contours.majorWidth
            : config.contours.lineWidth;

        if (lineWidth <= 0) continue;

        const path = buildContour(index * interval);
        strokeContour(path, lineWidth);
    }

    ctx.globalAlpha = 1;
}

// --------------------------------------------------
// Animation
// --------------------------------------------------

function animate(timestamp) {
    const delta = previousTime === null
        ? 0
        : Math.min((timestamp - previousTime) / 1000, 0.05);

    previousTime = timestamp;
    time += delta * config.terrain.speed;

    const smoothing =
        1 - Math.exp(-Math.max(0.1, config.mouse.smoothing) * delta);

    mouse.x += (mouse.targetX - mouse.x) * smoothing;
    mouse.y += (mouse.targetY - mouse.y) * smoothing;

    mouse.influence +=
        ((mouse.active && config.mouse.enabled ? 1 : 0) -
            mouse.influence) * smoothing;

    if (gridDirty) {
        gridDirty = false;
        rebuildGrid();
    }

    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, width, height);

    const { minimum, maximum } = sampleTerrain();
    drawContours(minimum, maximum);

    requestAnimationFrame(animate);
}

// --------------------------------------------------
// Mouse and touch
// --------------------------------------------------

function updateMouse(event) {
    if (
        event.target instanceof Element &&
        event.target.closest("[data-background-editor]")
    ) {
        mouse.active = false;
        return;
    }

    mouse.targetX = event.clientX;
    mouse.targetY = event.clientY;
    mouse.active = true;

    if (!mouse.initialized) {
        mouse.x = mouse.targetX;
        mouse.y = mouse.targetY;
        mouse.initialized = true;
    }
}

function deactivateMouse() {
    mouse.active = false;
}

window.addEventListener("pointermove", updateMouse);
window.addEventListener("pointerdown", updateMouse);

document.documentElement.addEventListener(
    "pointerleave", deactivateMouse
);

window.addEventListener("blur", deactivateMouse);
window.addEventListener("pointercancel", deactivateMouse);

window.addEventListener("pointerup", event => {
    if (event.pointerType !== "mouse") deactivateMouse();
});

document.addEventListener("visibilitychange", () => {
    previousTime = null;
    deactivateMouse();
});

window.addEventListener("resize", resize);

resize();
requestAnimationFrame(animate);

// --------------------------------------------------
// Optional editor
// --------------------------------------------------

if (config.panel.enabled) {
    import("./settings-editor.js")
        .then(({ mountEditor }) => {
            mountEditor({
                config,

                onChange(path) {
                    if (path === "resolution") {
                        gridDirty = true;
                    }

                    deactivateMouse();
                }
            });
        })
        .catch(error => {
            console.error("Could not load settings editor:", error);
        });
}
</script>
</body>
</html>
