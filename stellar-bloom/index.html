<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stellar Bloom</title>

<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #040711;
  }

  #background {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  #flight-status {
    position: fixed;
    bottom: 16px;
    left: 16px;
    max-width: calc(100% - 32px);
    padding: 8px 12px;
    border-radius: 8px;
    background: rgba(4, 7, 17, 0.45);
    color: #bbcce5;
    font: 12px/1.5 system-ui, sans-serif;
    pointer-events: none;
  }

  [hidden] {
    display: none !important;
  }
</style>
</head>

<body>
<canvas id="background" aria-hidden="true"></canvas>
<div id="flight-status" hidden></div>

<script type="module">
const config = {
  "stars": {
    "count": 1700,
    "initialSpeed": 13,
    "radius": 1.9,
    "maxCount": 450,
    "opacity": 0.97,
    "trails": 1,
    "sizeSlowdown": 0
  },
  "gravity": {
    "strength": 830,
    "range": 230,
    "softening": 66,
    "maxSpeed": 88,
    "mergeDistance": 1.15
  },
  "explosions": {
    "enabled": true,
    "glowMass": 10,
    "criticalMass": 22,
    "delay": 12,
    "delayVariation": 15,
    "fragments": 30,
    "speed": 132,
    "cooldown": 15,
    "shockwaveStrength": 100
  },
  "space": {
    "threeD": true,
    "sphereBoundary": true,
    "radius": 1200,
    "boundaryBounce": 0.45
  },
  "camera": {
    "distance": 1300,
    "zoom": 1.55,
    "rotationX": 9,
    "rotationY": 1,
    "rotationZ": 1,
    "rotationSpeedX": 0,
    "rotationSpeedY": 0.6,
    "rotationSpeedZ": 0,
    "showBoundary": false
  },
  "flight": {
    "enabled": false,
    "followDistance": 0,
    "heightOffset": 0,
    "fieldOfView": 75,
    "positionSmoothing": 12,
    "directionSmoothing": 5,
    "nearClip": 2,
    "showStatus": true
  },
  "mouse": {
    "enabled": false,
    "radius": 220,
    "strength": 45,
    "holdMultiplier": 2.5,
    "shockwave": 70,
    "smoothing": 7
  },
  "nebula": {
    "enabled": true,
    "clouds": 10,
    "opacity": 0.54,
    "size": 0.15,
    "colorA": [
      55,
      83,
      170
    ],
    "colorB": [
      150,
      49,
      143
    ],
    "colorC": [
      32,
      135,
      133
    ]
  },
  "appearance": {
    "backgroundColor": [
      4,
      7,
      17
    ],
    "starColor": [
      173,
      201,
      255
    ],
    "giantColor": [
      255,
      192,
      112
    ],
    "hotColor": [
      255,
      241,
      216
    ],
    "glow": 14
  },
  "animation": {
    "speed": 2,
    "paused": false,
    "respectReducedMotion": true
  },
  "panel": {
    "enabled": true
  }
};

window.getBackgroundConfig = () =>
  JSON.parse(JSON.stringify(config));

const canvas = document.querySelector("#background");
const ctx = canvas.getContext("2d");
const flightStatus = document.querySelector("#flight-status");
const nebulaCanvas = document.createElement("canvas");
const nebulaCtx = nebulaCanvas.getContext("2d");
const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)");
const physicsStep = 1 / 60;
const maximumPhysicsSteps = 6;
  
let width = 1;
let height = 1;
let stars = [];
let rings = [];
let previous = null;
let physicsAccumulator = 0;

let time = 0;
let nextId = 1;
let resetKey = "";
let nebulaKey = "";
let nebulaSeed = 89173;
let view;
let followedStar = null;
let flightWasEnabled = false;

const rotation = { x: 0, y: 0, z: 0 };

const flightState = {
  initialized: false,
  position: { x: 0, y: 0, z: 0 },
  forward: { x: 0, y: 0, z: -1 },
  up: { x: 0, y: 1, z: 0 }
};

const mouse = {
  x: 0,
  y: 0,
  targetX: 0,
  targetY: 0,
  active: false,
  held: false,
  influence: 0
};

const random = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const radians = value => value * Math.PI / 180;

const rgba = (color, alpha = 1) =>
  `rgba(${color.join(",")},${clamp(alpha, 0, 1)})`;

const mix = (a, b, t) =>
  a.map((value, i) => Math.round(value + (b[i] - value) * t));

function length(v) {
  return Math.hypot(v.x, v.y, v.z);
}

function normalize(v, fallback = { x: 0, y: 0, z: -1 }) {
  const size = length(v);
  if (size < 0.00001) return { ...fallback };
  return { x: v.x / size, y: v.y / size, z: v.z / size };
}

function dot(a, b) {
  return a.x * b.x + a.y * b.y + a.z * b.z;
}

function cross(a, b) {
  return {
    x: a.y * b.z - a.z * b.y,
    y: a.z * b.x - a.x * b.z,
    z: a.x * b.y - a.y * b.x
  };
}

function smoothVector(current, target, amount) {
  return {
    x: current.x + (target.x - current.x) * amount,
    y: current.y + (target.y - current.y) * amount,
    z: current.z + (target.z - current.z) * amount
  };
}

function direction() {
  if (!config.space.threeD) {
    const angle = random(0, Math.PI * 2);
    return { x: Math.cos(angle), y: Math.sin(angle), z: 0 };
  }

  const z = random(-1, 1);
  const angle = random(0, Math.PI * 2);
  const r = Math.sqrt(1 - z * z);

  return {
    x: r * Math.cos(angle),
    y: r * Math.sin(angle),
    z
  };
}

function starRadius(mass) {
  return config.stars.radius * Math.cbrt(mass);
}

function speedLimit(star) {
  const sizeRatio = Math.max(1, Math.cbrt(star.mass));

  return config.gravity.maxSpeed /
    Math.pow(sizeRatio, config.stars.sizeSlowdown);
}

function limitVelocity(star) {
  const speed = Math.hypot(star.vx, star.vy, star.vz);
  const maximum = speedLimit(star);

  if (speed > maximum) {
    const factor = maximum / speed;
    star.vx *= factor;
    star.vy *= factor;
    star.vz *= factor;
  }
}

function makeStar(position, mass = 1) {
  const d = direction();

  const star = {
    ...position,
    id: nextId++,
    mass,
    vx: d.x * config.stars.initialSpeed,
    vy: d.y * config.stars.initialSpeed,
    vz: d.z * config.stars.initialSpeed,
    cooldown: 0,
    criticalAge: 0,
    wait: config.explosions.delay +
      random(0, config.explosions.delayVariation),
    phase: random(0, Math.PI * 2)
  };

  limitVelocity(star);
  return star;
}

function sceneKey() {
  return JSON.stringify([
    config.stars.count,
    config.space.threeD,
    config.space.sphereBoundary,
    config.space.radius
  ]);
}

function nextStar() {
  if (!stars.length) return;

  const index = stars.indexOf(followedStar);
  followedStar = stars[(index + 1) % stars.length];
  flightState.initialized = false;
}

function reset() {
  stars = [];
  rings = [];

  const radius = config.space.radius * 0.9;

  for (let i = 0; i < Math.round(config.stars.count); i++) {
    let position;

    if (config.space.sphereBoundary) {
      const d = direction();

      const r = radius * Math.pow(
        Math.random(),
        config.space.threeD ? 1 / 3 : 1 / 2
      );

      position = { x: d.x * r, y: d.y * r, z: d.z * r };
    } else {
      position = {
        x: random(-radius, radius),
        y: random(-radius, radius),
        z: config.space.threeD ? random(-radius, radius) : 0
      };
    }

    stars.push(makeStar(position, random(0.7, 1.3)));
  }

  followedStar = stars[0] || null;
  flightState.initialized = false;
  resetKey = sceneKey();
}

function seededRandom() {
  let seed = nebulaSeed >>> 0;

  return () => {
    seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
    return seed / 4294967296;
  };
}

function buildNebula() {
  nebulaCanvas.width = Math.ceil(width / 2);
  nebulaCanvas.height = Math.ceil(height / 2);

  const w = nebulaCanvas.width;
  const h = nebulaCanvas.height;
  const rand = seededRandom();

  const palette = [
    config.nebula.colorA,
    config.nebula.colorB,
    config.nebula.colorC
  ];

  nebulaCtx.clearRect(0, 0, w, h);
  nebulaCtx.globalCompositeOperation = "screen";

  for (let cloud = 0; cloud < config.nebula.clouds; cloud++) {
    const cx = rand() * w;
    const cy = rand() * h;

    const radius = Math.max(w, h) * config.nebula.size *
      (0.45 + rand() * 0.55);

    const color = palette[cloud % palette.length];

    for (let puff = 0; puff < 14; puff++) {
      const angle = rand() * Math.PI * 2;
      const offset = rand() * radius * 0.7;
      const x = cx + Math.cos(angle) * offset;
      const y = cy + Math.sin(angle) * offset * 0.45;
      const r = radius * (0.12 + rand() * 0.3);

      const gradient = nebulaCtx.createRadialGradient(
        x, y, 0, x, y, r
      );

      gradient.addColorStop(0, rgba(color, 0.15));
      gradient.addColorStop(0.45, rgba(color, 0.06));
      gradient.addColorStop(1, rgba(color, 0));

      nebulaCtx.fillStyle = gradient;
      nebulaCtx.fillRect(x - r, y - r, r * 2, r * 2);
    }
  }

  nebulaCtx.globalCompositeOperation = "source-over";
  nebulaKey = JSON.stringify([width, height, config.nebula]);
}

function refresh() {
  if (sceneKey() !== resetKey) reset();

  const limit = Math.round(config.stars.maxCount);

  while (stars.length > limit) {
    const removed = stars.pop();
    merge(stars[0], removed);
  }

  for (const star of stars) limitVelocity(star);

  if (JSON.stringify([width, height, config.nebula]) !== nebulaKey) {
    buildNebula();
  }
}

function resize() {
  width = innerWidth;
  height = innerHeight;

  const dpr = Math.min(devicePixelRatio || 1, 2);
  canvas.width = Math.round(width * dpr);
  canvas.height = Math.round(height * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  buildNebula();
}

function rotateWorld(point) {
  let { x, y, z } = point;

  const rx = radians(config.camera.rotationX + rotation.x);
  const ry = radians(config.camera.rotationY + rotation.y);
  const rz = radians(config.camera.rotationZ + rotation.z);

  let cos = Math.cos(rx);
  let sin = Math.sin(rx);
  let ny = y * cos - z * sin;
  let nz = y * sin + z * cos;
  y = ny;
  z = nz;

  cos = Math.cos(ry);
  sin = Math.sin(ry);
  const nx = x * cos + z * sin;
  nz = -x * sin + z * cos;
  x = nx;
  z = nz;

  cos = Math.cos(rz);
  sin = Math.sin(rz);

  return {
    x: x * cos - y * sin,
    y: x * sin + y * cos,
    z
  };
}

function inverseRotate(vector) {
  let { x, y, z } = vector;

  const rx = radians(config.camera.rotationX + rotation.x);
  const ry = radians(config.camera.rotationY + rotation.y);
  const rz = radians(config.camera.rotationZ + rotation.z);

  let cos = Math.cos(rz);
  let sin = Math.sin(rz);
  let nx = x * cos + y * sin;
  let ny = -x * sin + y * cos;
  x = nx;
  y = ny;

  cos = Math.cos(ry);
  sin = Math.sin(ry);
  nx = x * cos - z * sin;
  let nz = x * sin + z * cos;
  x = nx;
  z = nz;

  cos = Math.cos(rx);
  sin = Math.sin(rx);
  ny = y * cos + z * sin;
  nz = -y * sin + z * cos;

  return { x, y: ny, z: nz };
}

function updateFlight(dt) {
  if (!followedStar || !stars.includes(followedStar)) {
    followedStar = stars[0] || null;
    flightState.initialized = false;
  }

  if (!followedStar) return;

  const targetDirection = normalize({
    x: followedStar.vx,
    y: followedStar.vy,
    z: followedStar.vz
  }, flightState.forward);

  const targetPosition = {
    x: followedStar.x -
      targetDirection.x * config.flight.followDistance,
    y: followedStar.y -
      targetDirection.y * config.flight.followDistance +
      config.flight.heightOffset,
    z: followedStar.z -
      targetDirection.z * config.flight.followDistance
  };

  if (!flightState.initialized) {
    flightState.position = targetPosition;
    flightState.forward = targetDirection;

    const preferredUp = Math.abs(targetDirection.y) > 0.95
      ? { x: 0, y: 0, z: 1 }
      : { x: 0, y: 1, z: 0 };

    const right = normalize(cross(targetDirection, preferredUp));
    flightState.up = normalize(cross(right, targetDirection));
    flightState.initialized = true;
    return;
  }

  const positionResponse = config.flight.positionSmoothing === 0
    ? 1
    : 1 - Math.exp(-config.flight.positionSmoothing * dt);

  const directionResponse = config.flight.directionSmoothing === 0
    ? 1
    : 1 - Math.exp(-config.flight.directionSmoothing * dt);

  flightState.position = smoothVector(
    flightState.position,
    targetPosition,
    positionResponse
  );

  flightState.forward = normalize(
    smoothVector(
      flightState.forward,
      targetDirection,
      directionResponse
    ),
    targetDirection
  );

  let right = cross(flightState.forward, flightState.up);

  if (length(right) < 0.001) {
    right = cross(
      flightState.forward,
      Math.abs(flightState.forward.y) > 0.95
        ? { x: 0, y: 0, z: 1 }
        : { x: 0, y: 1, z: 0 }
    );
  }

  flightState.up = normalize(
    cross(normalize(right), flightState.forward)
  );
}

function makeView() {
  if (config.flight.enabled && followedStar) {
    const forward = normalize(rotateWorld(flightState.forward));
    const up = normalize(rotateWorld(flightState.up));
    const right = normalize(cross(forward, up));

    return {
      position: rotateWorld(flightState.position),
      forward,
      up: normalize(cross(right, forward)),
      right,
      focal:
        height / 2 /
        Math.tan(radians(config.flight.fieldOfView) / 2) *
        config.camera.zoom,
      near: config.flight.nearClip,
      flight: true
    };
  }

  return {
    position: { x: 0, y: 0, z: config.camera.distance },
    forward: { x: 0, y: 0, z: -1 },
    right: { x: 1, y: 0, z: 0 },
    up: { x: 0, y: -1, z: 0 },
    focal:
      Math.min(width, height) /
      (config.space.radius * 2.2) *
      config.camera.zoom *
      config.camera.distance,
    near: 60,
    flight: false
  };
}

function project(point) {
  const world = rotateWorld(point);

  const relative = {
    x: world.x - view.position.x,
    y: world.y - view.position.y,
    z: world.z - view.position.z
  };

  const distance = dot(relative, view.forward);
  if (distance < view.near) return null;

  const scale = view.focal / distance;

  return {
    x: width / 2 + dot(relative, view.right) * scale,
    y: height / 2 - dot(relative, view.up) * scale,
    scale,
    distance
  };
}

function screenForce(x, y) {
  const pixelsPerUnit = view.flight
    ? view.focal / Math.max(100, config.space.radius * 0.4)
    : view.focal / config.camera.distance;

  const factor = 1 / Math.max(0.1, pixelsPerUnit);

  const transformed = {
    x: (view.right.x * x - view.up.x * y) * factor,
    y: (view.right.y * x - view.up.y * y) * factor,
    z: (view.right.z * x - view.up.z * y) * factor
  };

  const force = inverseRotate(transformed);
  if (!config.space.threeD) force.z = 0;
  return force;
}

function confine(star) {
  const radius = Math.max(
    10,
    config.space.radius - starRadius(star.mass)
  );

  if (config.space.sphereBoundary) {
    const distance = Math.hypot(star.x, star.y, star.z);
    if (distance <= radius) return;

    const nx = star.x / distance;
    const ny = star.y / distance;
    const nz = star.z / distance;

    star.x = nx * radius;
    star.y = ny * radius;
    star.z = nz * radius;

    const outward =
      star.vx * nx + star.vy * ny + star.vz * nz;

    if (outward > 0) {
      const impulse =
        outward * (1 + config.space.boundaryBounce);

      star.vx -= nx * impulse;
      star.vy -= ny * impulse;
      star.vz -= nz * impulse;
    }
  } else {
    for (const axis of ["x", "y", "z"]) {
      if (axis === "z" && !config.space.threeD) continue;

      if (star[axis] > radius) star[axis] -= radius * 2;
      if (star[axis] < -radius) star[axis] += radius * 2;
    }
  }
}

function merge(a, b) {
  const oldMass = Math.max(a.mass, b.mass);
  const total = a.mass + b.mass;

  for (const axis of ["x", "y", "z", "vx", "vy", "vz"]) {
    a[axis] = (a[axis] * a.mass + b[axis] * b.mass) / total;
  }

  // Artistic braking: growth slows the merged star immediately.
  // This is applied once per merge, rather than every frame.
  const growthRatio = Math.cbrt(total / oldMass);
  const slowdown = Math.pow(
    growthRatio,
    config.stars.sizeSlowdown
  );

  a.vx /= slowdown;
  a.vy /= slowdown;
  a.vz /= slowdown;

  a.mass = total;
  a.criticalAge = Math.max(a.criticalAge, b.criticalAge);
  a.wait = Math.max(a.wait, b.wait);

  limitVelocity(a);

  if (followedStar === b) followedStar = a;
}

function explode(star, available) {
  const count = Math.min(
    Math.round(config.explosions.fragments),
    available
  );

  if (count < 2) return null;

  const directions = Array.from({ length: count }, direction);

  const mean = directions.reduce(
    (sum, d) => ({
      x: sum.x + d.x / count,
      y: sum.y + d.y / count,
      z: sum.z + d.z / count
    }),
    { x: 0, y: 0, z: 0 }
  );

  const radius = starRadius(star.mass) * 2 + 8;

  const fragments = directions.map(d => {
    const fragment = makeStar({
      x: star.x + d.x * radius,
      y: star.y + d.y * radius,
      z: star.z + d.z * radius
    }, star.mass / count);

    fragment.vx =
      star.vx + (d.x - mean.x) * config.explosions.speed;

    fragment.vy =
      star.vy + (d.y - mean.y) * config.explosions.speed;

    fragment.vz =
      star.vz + (d.z - mean.z) * config.explosions.speed;

    fragment.cooldown = config.explosions.cooldown;

    limitVelocity(fragment);
    confine(fragment);
    return fragment;
  });

  if (followedStar === star) {
    const parentDirection = normalize({
      x: star.vx,
      y: star.vy,
      z: star.vz
    }, flightState.forward);

    function score(candidate) {
      return dot(
        normalize({
          x: candidate.vx,
          y: candidate.vy,
          z: candidate.vz
        }),
        parentDirection
      );
    }

    followedStar = fragments.reduce(
      (best, fragment) =>
        score(fragment) > score(best) ? fragment : best,
      fragments[0]
    );
  }

  rings.push({
    x: star.x,
    y: star.y,
    z: star.z,
    age: 0,
    type: "explosion"
  });

  if (rings.length > 25) rings.shift();
  return fragments;
}

function simulate(dt) {
  const dead = new Set();
  const rangeSquared = config.gravity.range ** 2;
  const softened = config.gravity.softening ** 2;

  for (let i = 0; i < stars.length; i++) {
    if (dead.has(i)) continue;
    const a = stars[i];

    for (let j = i + 1; j < stars.length; j++) {
      if (dead.has(j)) continue;
      const b = stars[j];

      const dx = b.x - a.x;
      const dy = b.y - a.y;
      const dz = b.z - a.z;
      const squared = dx * dx + dy * dy + dz * dz;

      const mergeRadius =
        (starRadius(a.mass) + starRadius(b.mass)) *
        config.gravity.mergeDistance;

      if (
        a.cooldown <= 0 &&
        b.cooldown <= 0 &&
        squared < mergeRadius * mergeRadius
      ) {
        merge(a, b);
        dead.add(j);
        continue;
      }

      if (squared > rangeSquared) continue;

      const force = config.gravity.strength /
        Math.pow(squared + softened, 1.5);

      a.vx += dx * force * b.mass * dt;
      a.vy += dy * force * b.mass * dt;
      a.vz += dz * force * b.mass * dt;

      b.vx -= dx * force * a.mass * dt;
      b.vy -= dy * force * a.mass * dt;
      b.vz -= dz * force * a.mass * dt;
    }
  }

  stars = stars.filter((_, index) => !dead.has(index));

  for (const ring of rings) ring.age += dt;
  rings = rings.filter(ring => ring.age < 3);

  for (const star of stars) {
    star.cooldown = Math.max(0, star.cooldown - dt);
    const screen = project(star);

    if (
      screen &&
      config.mouse.enabled &&
      !(config.flight.enabled && star === followedStar)
    ) {
      const dx = mouse.x - screen.x;
      const dy = mouse.y - screen.y;
      const distance = Math.hypot(dx, dy);

      const proximity = clamp(
        1 - distance / config.mouse.radius,
        0,
        1
      );

      const strength =
        proximity * proximity *
        mouse.influence *
        config.mouse.strength *
        (mouse.held ? config.mouse.holdMultiplier : 1);

      const denominator = Math.max(distance, 20);

      const force = screenForce(
        dx / denominator * strength,
        dy / denominator * strength
      );

      star.vx += force.x * dt;
      star.vy += force.y * dt;
      star.vz += force.z * dt;
    }

    for (const ring of rings) {
      let force;

      if (ring.type === "pointer") {
        if (!screen) continue;

        const dx = screen.x - ring.x;
        const dy = screen.y - ring.y;
        const distance = Math.hypot(dx, dy);

        const wave = Math.exp(
          -Math.pow((distance - ring.age * 220) / 65, 2)
        ) * Math.max(0, 1 - ring.age / 3);

        force = screenForce(
          dx / Math.max(10, distance) *
            config.mouse.shockwave * wave,
          dy / Math.max(10, distance) *
            config.mouse.shockwave * wave
        );
      } else {
        const dx = star.x - ring.x;
        const dy = star.y - ring.y;
        const dz = star.z - ring.z;
        const distance = Math.hypot(dx, dy, dz);

        const wave = Math.exp(
          -Math.pow((distance - ring.age * 170) / 55, 2)
        ) * Math.max(0, 1 - ring.age / 3);

        const strength =
          config.explosions.shockwaveStrength * wave /
          Math.max(10, distance);

        force = {
          x: dx * strength,
          y: dy * strength,
          z: dz * strength
        };
      }

      star.vx += force.x * dt;
      star.vy += force.y * dt;
      star.vz += force.z * dt;
    }

    limitVelocity(star);

    star.x += star.vx * dt;
    star.y += star.vy * dt;
    star.z += star.vz * dt;
    confine(star);

    star.criticalAge =
      star.mass >= config.explosions.criticalMass
        ? star.criticalAge + dt
        : 0;
  }

  const original = stars;
  const next = [];
  let population = original.length;

  for (const star of original) {
    if (
      config.explosions.enabled &&
      star.mass >= config.explosions.criticalMass &&
      star.cooldown <= 0 &&
      star.criticalAge >= star.wait
    ) {
      const available =
        Math.round(config.stars.maxCount) - population + 1;

      const fragments = explode(star, available);

      if (fragments) {
        next.push(...fragments);
        population += fragments.length - 1;
        continue;
      }
    }

    next.push(star);
  }

  stars = next;
}

function drawBoundary() {
  if (
    !config.camera.showBoundary ||
    !config.space.sphereBoundary
  ) return;

  ctx.strokeStyle = "rgba(160,190,240,.12)";
  ctx.lineWidth = 0.7;

  for (let plane = 0; plane < 3; plane++) {
    ctx.beginPath();
    let connected = false;

    for (let i = 0; i <= 160; i++) {
      const angle = i / 160 * Math.PI * 2;
      const a = Math.cos(angle) * config.space.radius;
      const b = Math.sin(angle) * config.space.radius;

      const point = plane === 0
        ? { x: a, y: b, z: 0 }
        : plane === 1
          ? { x: a, y: 0, z: b }
          : { x: 0, y: a, z: b };

      const screen = project(point);

      if (!screen) {
        connected = false;
      } else {
        if (connected) ctx.lineTo(screen.x, screen.y);
        else ctx.moveTo(screen.x, screen.y);
        connected = true;
      }
    }

    ctx.stroke();
  }
}

function draw() {
  ctx.fillStyle = rgba(config.appearance.backgroundColor);
  ctx.fillRect(0, 0, width, height);

  // Nebulas are static decorative artwork.
  if (config.nebula.enabled) {
    ctx.save();
    ctx.globalAlpha = config.nebula.opacity;
    ctx.drawImage(nebulaCanvas, 0, 0, width, height);
    ctx.restore();
  }

  drawBoundary();

  const projected = stars
    .filter(star => !(view.flight && star === followedStar))
    .map(star => ({ star, screen: project(star) }))
    .filter(item => item.screen);

  projected.sort(
    (a, b) => b.screen.distance - a.screen.distance
  );

  for (const { star, screen } of projected) {
    const glowing = clamp(
      (star.mass - config.explosions.glowMass) /
      Math.max(
        1,
        config.explosions.criticalMass -
        config.explosions.glowMass
      ),
      0,
      1
    );

    const color = mix(
      mix(
        config.appearance.starColor,
        config.appearance.giantColor,
        glowing
      ),
      config.appearance.hotColor,
      clamp(
        star.criticalAge / Math.max(1, star.wait),
        0,
        1
      )
    );

    const radius = clamp(
      starRadius(star.mass) * screen.scale,
      0.45,
      70
    );

    const depthReference = view.flight
      ? config.space.radius * 0.65
      : config.camera.distance;

    const depthAlpha = clamp(
      depthReference / screen.distance,
      0.15,
      1
    );

    const instability = star.criticalAge > 0
      ? 1 + Math.sin(time * 5 + star.phase) * 0.12
      : 1;

    const halo = Math.min(
      220,
      radius * 3 +
      config.appearance.glow *
      screen.scale * (0.2 + glowing)
    );

    if (
      screen.x < -halo ||
      screen.x > width + halo ||
      screen.y < -halo ||
      screen.y > height + halo
    ) continue;

    const gradient = ctx.createRadialGradient(
      screen.x,
      screen.y,
      0,
      screen.x,
      screen.y,
      halo
    );

    gradient.addColorStop(
      0,
      rgba(color, (0.2 + glowing * 0.35) * depthAlpha)
    );
    gradient.addColorStop(1, rgba(color, 0));

    ctx.fillStyle = gradient;
    ctx.fillRect(
      screen.x - halo,
      screen.y - halo,
      halo * 2,
      halo * 2
    );

    if (config.stars.trails > 0) {
      const tail = project({
        x: star.x - star.vx * config.stars.trails,
        y: star.y - star.vy * config.stars.trails,
        z: star.z - star.vz * config.stars.trails
      });

      if (
        tail &&
        Math.hypot(
          screen.x - tail.x,
          screen.y - tail.y
        ) > 0.1
      ) {
        const trail = ctx.createLinearGradient(
          tail.x, tail.y, screen.x, screen.y
        );

        trail.addColorStop(0, rgba(color, 0));
        trail.addColorStop(1, rgba(color, 0.4 * depthAlpha));

        ctx.strokeStyle = trail;
        ctx.lineWidth = Math.max(0.5, radius * 0.5);
        ctx.beginPath();
        ctx.moveTo(tail.x, tail.y);
        ctx.lineTo(screen.x, screen.y);
        ctx.stroke();
      }
    }

    ctx.fillStyle = rgba(
      color,
      config.stars.opacity * depthAlpha
    );

    ctx.beginPath();
    ctx.arc(
      screen.x,
      screen.y,
      radius * instability,
      0,
      Math.PI * 2
    );
    ctx.fill();
  }

  for (const ring of rings) {
    const screen = ring.type === "pointer"
      ? ring
      : project(ring);

    if (!screen) continue;

    const radius = Math.min(
      3000,
      ring.age *
      (ring.type === "pointer" ? 220 : 170 * screen.scale)
    );

    ctx.strokeStyle = rgba(
      config.appearance.hotColor,
      (1 - ring.age / 3) * 0.2
    );
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(screen.x, screen.y, radius, 0, Math.PI * 2);
    ctx.stroke();
  }

  flightStatus.hidden =
    !config.flight.enabled ||
    !config.flight.showStatus;

  if (!flightStatus.hidden && followedStar) {
    const speed = Math.hypot(
      followedStar.vx,
      followedStar.vy,
      followedStar.vz
    );

    flightStatus.textContent =
      `Riding star ${followedStar.id} · ` +
      `Mass ${followedStar.mass.toFixed(1)} · ` +
      `Speed ${speed.toFixed(1)} · ` +
      `${stars.length} stars`;
  }
}

function frame(timestamp) {
  const realDt = previous === null
    ? 0
    : Math.min((timestamp - previous) / 1000, 0.1);

  previous = timestamp;

  const response =
    1 - Math.exp(-config.mouse.smoothing * realDt);

  mouse.x += (mouse.targetX - mouse.x) * response;
  mouse.y += (mouse.targetY - mouse.y) * response;

  mouse.influence +=
    ((mouse.active ? 1 : 0) - mouse.influence) * response;

  if (flightWasEnabled !== config.flight.enabled) {
    flightState.initialized = false;
    flightWasEnabled = config.flight.enabled;
  }

  if (config.flight.enabled && !flightState.initialized) {
    updateFlight(0);
  }

  const still =
    config.animation.paused ||
    (
      config.animation.respectReducedMotion &&
      reducedMotion.matches
    );

  if (still || config.animation.speed === 0) {
    physicsAccumulator = 0;
  } else {
    physicsAccumulator = Math.min(
      physicsAccumulator + realDt * config.animation.speed,
      physicsStep * maximumPhysicsSteps
    );

    let completedSteps = 0;

    while (
      physicsAccumulator >= physicsStep &&
      completedSteps < maximumPhysicsSteps
    ) {
      time += physicsStep;

      rotation.x =
        (
          rotation.x +
          config.camera.rotationSpeedX * physicsStep
        ) % 360;

      rotation.y =
        (
          rotation.y +
          config.camera.rotationSpeedY * physicsStep
        ) % 360;

      rotation.z =
        (
          rotation.z +
          config.camera.rotationSpeedZ * physicsStep
        ) % 360;

      view = makeView();
      simulate(physicsStep);

      if (config.flight.enabled) {
        updateFlight(physicsStep);
      }

      physicsAccumulator -= physicsStep;
      completedSteps++;
    }
  }

  view = makeView();
  draw();

  requestAnimationFrame(frame);
}

function pointer(event) {
  if (event.target.closest?.("[data-background-editor]")) {
    leave();
    return false;
  }

  if (!mouse.active) {
    mouse.x = event.clientX;
    mouse.y = event.clientY;
  }

  mouse.targetX = event.clientX;
  mouse.targetY = event.clientY;
  mouse.active = true;
  return true;
}

function leave() {
  mouse.active = false;
  mouse.held = false;
}

addEventListener("pointermove", pointer);

addEventListener("pointerdown", event => {
  if (!pointer(event) || !config.mouse.enabled) return;
  if (event.pointerType === "mouse" && event.button !== 0) return;

  mouse.held = true;

  rings.push({
    x: event.clientX,
    y: event.clientY,
    age: 0,
    type: "pointer"
  });

  if (rings.length > 25) rings.shift();
});

addEventListener("pointerup", event => {
  mouse.held = false;
  if (event.pointerType !== "mouse") mouse.active = false;
});

addEventListener("pointercancel", leave);
addEventListener("blur", leave);

document.documentElement.addEventListener("pointerleave", leave);

document.addEventListener("visibilitychange", () => {
  previous = null;
  leave();
});

addEventListener("resize", resize);

resize();
reset();
requestAnimationFrame(frame);

if (config.panel.enabled) {
  import(`./settings-editor.js?v=${Date.now()}`)
    .then(({ createSettingsEditor }) => {
      createSettingsEditor({
        config,
        onChange: refresh,
        onReset: reset,
        onNextStar: nextStar,
        onResetRotation: () => {
          rotation.x = 0;
          rotation.y = 0;
          rotation.z = 0;
        },
        onNebula: () => {
          nebulaSeed = Math.floor(Math.random() * 0xffffffff);
          buildNebula();
        }
      });
    })
    .catch(error => {
      console.error("Editor could not load:", error);
    });
}
</script>
</body>
</html>
