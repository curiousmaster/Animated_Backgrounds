<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Moving Worlds · Scroll Gallery</title>
<style>
* { box-sizing: border-box; }
html { background:#070b14; color:#f1f5fa; font-family:system-ui,sans-serif; }
body { margin:0; }
.stage { position:fixed; inset:0; z-index:0; pointer-events:none; background:#070b14; }
.stage iframe { position:absolute; inset:0; width:100%; height:100%; border:0; opacity:0; pointer-events:none; }
main { position:relative; z-index:1; }
section { height:100vh; height:100svh; min-height:480px; display:grid; place-items:center; padding:70px 24px; }
.card { width:min(560px,100%); padding:clamp(24px,5vw,42px); border:1px solid #ffffff30; border-radius:24px; background:#060b1438; text-shadow:0 2px 12px #000; }
.kicker { font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:#b4d5e6; }
h1,h2 { font-size:clamp(30px,6vw,56px); line-height:1.08; letter-spacing:-.04em; margin:18px 0; }
.description { color:#dae3ed; line-height:1.75; font-size:clamp(15px,2vw,18px); }
.card a { color:#b5e4ee; text-underline-offset:5px; }
.scroll-hint { margin-top:26px; color:#c0cad5; font-size:12px; }
header { position:fixed; top:max(16px,env(safe-area-inset-top)); left:max(20px,env(safe-area-inset-left)); right:max(20px,env(safe-area-inset-right)); z-index:3; display:flex; justify-content:space-between; gap:16px; pointer-events:none; font-size:12px; text-shadow:0 2px 8px #000; }
header a { pointer-events:auto; color:#e2edf4; padding:12px; border-radius:10px; background:#070b1460; text-decoration:none; }
.counter { padding:12px; }
.progress { position:fixed; bottom:0; left:0; height:3px; width:100%; z-index:3; background:linear-gradient(90deg,#72d9d0,#c3a2eb); transform-origin:left; transform:scaleX(0); }
#status { position:fixed; bottom:max(16px,env(safe-area-inset-bottom)); left:20px; z-index:3; max-width:calc(100% - 40px); font-size:12px; color:#e6d3ad; background:#070b14b0; border-radius:8px; padding:8px 12px; }
#status:empty { display:none; }
:focus-visible { outline:2px solid #8acde5; outline-offset:4px; }
@media(max-width:480px) { section { padding:76px 16px; } .card { border-radius:18px; } }
</style>
</head>
<body>
<div class="stage" aria-hidden="true">
<iframe title="Background layer one" tabindex="-1"></iframe>
<iframe title="Background layer two" tabindex="-1"></iframe>
</div>
<header><a href="index.html">← Background gallery</a><span class="counter" id="counter"></span></header>
<main id="sections"></main>
<div class="progress" aria-hidden="true"></div>
<div id="status" role="status" aria-live="polite"></div>
<script>
"use strict";
// Preserve the gallery's folder names. Edit these to match your project.
const backgrounds = [
    { name: "Blob Grid", folder: "blob-grid", description: "A field of luminous dots swells into soft, shifting blobs, turning a simple grid into a living surface." },
    { name: "Wave Field", folder: "wave-field", description: "Gentle waves travel across a field of points, creating a rolling landscape of light." },
    { name: "Magnetic Particles", folder: "magnetic-particles", description: "A cloud of glowing particles responds to magnetic forces, gathering and scattering around your pointer." },
    { name: "Topographic Contours", folder: "topographic-contours", description: "Fine contour lines trace an evolving landscape, revealing flowing ridges and valleys." },
    { name: "Aurora Ribbons", folder: "aurora-ribbons", description: "Curtains of luminous color drift through the darkness like an abstract northern sky." },
    { name: "Elastic Mesh", folder: "elastic-mesh", description: "A delicate mesh stretches and relaxes as your pointer disturbs its woven surface." },
    { name: "Constellation Network", folder: "constellation-network", description: "Drifting stars form fleeting connections, creating a constellation that continually redraws itself." },
    { name: "Liquid Interference", folder: "liquid-interference", description: "Overlapping waves create liquid patterns, bright seams, and shifting pockets of color." },
    { name: "Scanning Light", folder: "scanning-light", description: "Bands of light sweep across the surface, revealing details before they disappear into darkness." },
    { name: "Flowing Glyphs", folder: "flowing-glyphs", description: "Streams of glowing glyphs flow through the scene, creating a quiet, digital atmosphere." },
    { name: "Orbital Trails", folder: "orbital-trails", description: "Luminous paths curl around invisible centers, leaving graceful traces of their motion." },
    { name: "Impossible Windows", folder: "impossible-windows", description: "Floating windows reveal fragments of alternate motion, layering different rhythms within one scene." },
    { name: "Memory Fossils", folder: "memory-fossils", description: "Crystal-like traces emerge and age into delicate fossils, preserving echoes of your interaction." },
    { name: "Shadow Organisms", folder: "shadow-organisms", description: "Soft shadow creatures drift across the surface, retreating from the light around your pointer." },
    { name: "Woven Time", folder: "woven-time", description: "Interlaced threads carry different rhythms, weaving a fabric that settles into harmony nearby." },
    { name: "Borrowed Dimensions", folder: "borrowed-dimensions", description: "Geometric forms shift between shapes and dimensions, creating a gently unfolding spatial illusion." },
    { name: "Living Atlas", folder: "living-atlas", description: "Contours, particles, memories, and flowing light share a living landscape that responds to exploration." },
	{ name: "Glass Tides", folder: "glass-tides", description: "Translucent glass plates drift above a hidden pattern, bending its appearance as they shift and tilt." },
	{ name: "Echo Architecture", folder: "echo-architecture", description: "Wireframe structures unfold and dissolve, suggesting impossible buildings suspended in darkness." },
	{ name: "Chromatic Faults", folder: "chromatic-faults", description: "Fine fractures carry pulses of color through branching paths; your pointer bends their course." },
	{ name: "Paper Weather", folder: "paper-weather", description: "Folded shapes float through gentle gusts, tumbling and opening as your pointer stirs the air." },
	{ name: "Signal Archaeology", folder: "signal-archaeology", description: "Broken waveforms and scattered diagrams drift through darkness. Move nearby to tune them into clarity." },
	{ name: "Prismatic Rain", folder: "prismatic-rain", description: "Falling strokes of light split into spectral trails as they cross prism bands. Your pointer becomes another prism." },
	{ name: "Breathing Caverns", folder: "breathing-caverns", description: "Layers of illuminated cave walls breathe around a dark opening. Move your pointer to reveal their depth." },
	{ name: "Clockwork Garden", folder: "clockwork-garden", description: "Fine stems grow into rotating gears and geometric flowers, then retract. Your pointer awakens nearby mechanisms." },
	{ name: "Negative Constellations", folder: "negative-constellations", description: "Dark openings drift through a luminous field, joined by shadow lines. Your pointer parts them to reveal light." },
	{ name: "Velvet Vortices", folder: "velvet-vortices", description: "Soft strokes follow wandering vortices like brushed velvet. Move your pointer to comb the surface and leave a fading impression." },
	{ name: "Luminous Sediments", folder: "luminous-sediments", description: "Glowing grains settle into layered dunes. Gentle currents loosen them, while your pointer lifts them into drifting clouds." },
	{ name: "Origami Horizons", folder: "origami-horizons", description: "Translucent triangular folds lift and settle into an abstract landscape. Your pointer raises nearby ridges." },
	{ name: "Orbiting Silence", folder: "orbiting-silence", description: "Fine arcs orbit invisible centers and briefly align. Your pointer gathers nearby arcs into a temporary orbit." },
	{ name: "Capillary Light", folder: "capilary-light", description: "Luminous ink spreads through branching channels, blending where colors meet. Your pointer feeds fresh color into the network." },
	{ name: "Mirage Loom", folder: "mirrage-loom", description: "Fine stripe layers slide across one another, forming shifting moir\u00e9 patterns. Your pointer bends the weave like a lens." },
	{ name: "Floating Tesserae", folder: "floating-tesserae", description: "Translucent mosaic tiles drift apart and reassemble into flowing patches of color. Your pointer opens a gap that gently closes behind it." },
	{ name: "Resonant Pools", folder: "resonant-pools", description: "Ripples from scattered pools reinforce and cancel one another, forming bright seams. Your pointer adds a source to reshape the pattern." },
	{ name: "Solar Herbarium", folder: "solar-herbarium", description: "Translucent leaves slowly unfurl as moving light reveals their veins. Your pointer illuminates the foliage like a soft spotlight." },
	{ name: "Phase Lanterns", folder: "phase-lanterns", description: "Floating halos morph between rings, polygons, and interrupted loops. Your pointer draws nearby lanterns into a shared rhythm." },
];

// Crossfade during the final 35% of each section.
const transitionStart = 0.65;
const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)");
const main = document.getElementById("sections");
const status = document.getElementById("status");
const counter = document.getElementById("counter");
const progress = document.querySelector(".progress");
const slots = [...document.querySelectorAll(".stage iframe")].map(frame => ({
    frame, index: -1, ready: false, token: 0, timeout: null
}));

function backgroundURL(index) {
    return backgrounds[index].folder.split("/").map(encodeURIComponent).join("/") + "/index.html";
}

backgrounds.forEach((background, index) => {
    const section = document.createElement("section");
    section.id = `scene-${index + 1}`;
    const card = document.createElement("article");
    card.className = "card";
    const kicker = document.createElement("p");
    kicker.className = "kicker";
    kicker.textContent = `Moving worlds · ${String(index + 1).padStart(2, "0")} / ${backgrounds.length}`;
    const title = document.createElement(index ? "h2" : "h1");
    title.textContent = background.name;
    const description = document.createElement("p");
    description.className = "description";
    description.textContent = background.description;
    const link = document.createElement("a");
    link.href = backgroundURL(index);
    link.target = "_blank";
    link.rel = "noopener";
    link.textContent = "Open & customize ↗";
    const hint = document.createElement("p");
    hint.className = "scroll-hint";
    hint.textContent = index === backgrounds.length - 1
        ? "The final world. Scroll upward to revisit the collection."
        : "Scroll down to discover the next world ↓";
    card.append(kicker, title, description, link, hint);
    section.append(card);
    main.append(section);
});

let sectionTops = [];
let queued = false;

function measure() {
    sectionTops = [...main.children].map(section => section.offsetTop);
    schedule();
}

function unload(slot) {
    clearTimeout(slot.timeout);
    slot.token++;
    slot.index = -1;
    slot.ready = false;
    slot.frame.onload = null;
    slot.frame.style.opacity = "0";
    // Navigation destroys the previous document and its animation loop.
    slot.frame.src = "about:blank";
}

function load(slot, index) {
    const token = ++slot.token;
    slot.index = index;
    slot.ready = false;
    slot.frame.style.opacity = "0";
    const expected = new URL(backgroundURL(index), document.baseURI).href;
    slot.frame.onload = () => {
        if (slot.token !== token) return;
        try {
            const doc = slot.frame.contentDocument;
            if (!doc || slot.frame.contentWindow.location.href !== expected) return;
            if (!doc.querySelector("canvas")) {
                status.textContent = `Could not find the ${backgrounds[index].name} animation. Check its folder path.`;
                return;
            }
            // Hide current and later-inserted editors in the scrolling view.
            // The separate "Open & customize" page retains its editor.
            const style = doc.createElement("style");
            style.textContent = "[data-background-editor] { display:none !important; }";
            doc.head.append(style);
            clearTimeout(slot.timeout);
            slot.ready = true;
            schedule();
        } catch {
            status.textContent = "Serve the gallery and backgrounds from the same origin.";
        }
    };
    slot.timeout = setTimeout(() => {
        if (slot.token === token && !slot.ready) {
            status.textContent = `Still waiting for ${backgrounds[index].name}. Check its folder path.`;
        }
    }, 10000);
    slot.frame.src = expected;
}

function render() {
    queued = false;
    const y = Math.max(0, scrollY);
    let index = 0;
    while (index + 1 < sectionTops.length && y >= sectionTops[index + 1]) index++;
    const section = main.children[index];
    const fraction = Math.min(1, Math.max(0, (y - sectionTops[index]) / section.offsetHeight));
    const blend = reducedMotion.matches || index === backgrounds.length - 1
        ? 0 : Math.max(0, (fraction - transitionStart) / (1 - transitionStart));
    const desired = blend > 0 ? [index, index + 1] : [index];

    // Keep an already-running outgoing scene while the new scene loads.
    // At most two background documents exist at any point.
    for (const requested of desired) {
        if (slots.some(slot => slot.index === requested)) continue;
        let available = slots.find(slot => slot.index < 0);
        if (!available) {
            available = slots.find(slot => !desired.includes(slot.index));
            if (available) unload(available);
        }
        if (available) load(available, requested);
    }
    const base = slots.find(slot => slot.index === index);
    const next = slots.find(slot => slot.index === index + 1);

    if (base?.ready) {
        status.textContent = "";
        for (const slot of slots) {
            if (!desired.includes(slot.index) && slot.index >= 0) unload(slot);
        }
        base.frame.style.zIndex = "0";
        base.frame.style.opacity = "1";
        if (blend > 0 && next) {
            next.frame.style.zIndex = "1";
            next.frame.style.opacity = next.ready ? String(blend) : "0";
        }
    } else {
        // Preserve the last visible scene instead of fading through blank.
        const fallback = slots.find(slot => slot.ready && !desired.includes(slot.index));
        if (fallback) fallback.frame.style.opacity = "1";
    }

    counter.textContent = `${index + 1} / ${backgrounds.length}`;
    const maximum = document.documentElement.scrollHeight - innerHeight;
    progress.style.transform = `scaleX(${maximum > 0 ? Math.min(1, y / maximum) : 0})`;
}

function schedule() {
    if (!queued) {
        queued = true;
        requestAnimationFrame(render);
    }
}

addEventListener("scroll", schedule, { passive: true });
addEventListener("resize", measure);
reducedMotion.addEventListener("change", schedule);
measure();
</script>
</body>
</html>
