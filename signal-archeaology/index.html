<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Signal Archaeology</title>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #050b10;
    }

    #background {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <canvas id="background" aria-hidden="true"></canvas>

  <script type="module">
    const config = {
      signals: {
        count: 42,
        width: 190,
        height: 48,
        speed: 9,
        frequency: 1.2,
        noise: 0.75,
        flicker: 0.35,
        decay: 0.3
      },

      tuning: {
        enabled: true,
        radius: 230,
        strength: 1,
        smoothing: 7,
        release: 1.4,
        showField: true
      },

      appearance: {
        backgroundColor: [5, 11, 16],
        signalColor: [93, 189, 178],
        tunedColor: [219, 246, 214],
        accentColor: [228, 166, 91],
        opacity: 0.38,
        lineWidth: 0.8,
        glow: 8,
        gridOpacity: 0.035,
        labels: true
      },

      animation: {
        speed: 1,
        paused: false,
        respectReducedMotion: true
      },

      panel: {
        enabled: true
      }
    };

    window.getBackgroundConfig = () =>
      JSON.parse(JSON.stringify(config));

    const canvas = document.querySelector("#background");
    const ctx = canvas.getContext("2d");
    const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)");

    let width = 1;
    let height = 1;
    let fragments = [];
    let time = 0;
    let previous = null;

    const mouse = {
      x: 0,
      y: 0,
      targetX: 0,
      targetY: 0,
      active: false,
      influence: 0
    };

    const random = (min, max) => min + Math.random() * (max - min);
    const clamp = (value, min, max) => Math.max(min, Math.min(max, value));
    const rgba = (color, alpha = 1) =>
      `rgba(${color.join(",")},${clamp(alpha, 0, 1)})`;

    function mix(a, b, amount) {
      return a.map((value, i) =>
        Math.round(value + (b[i] - value) * amount)
      );
    }

    function makeFragment() {
      return {
        x: Math.random() * width,
        y: Math.random() * height,
        scale: random(0.65, 1.3),
        phase: random(0, Math.PI * 2),
        drift: random(0.6, 1.4),
        type: Math.floor(random(0, 3)),
        tuning: 0,
        seed: random(1, 1000),
        code: Math.floor(random(0, 65536))
          .toString(16)
          .padStart(4, "0")
          .toUpperCase()
      };
    }

    function syncFragments() {
      const count = Math.round(config.signals.count);

      while (fragments.length < count) {
        fragments.push(makeFragment());
      }

      fragments.length = count;
    }

    function reset() {
      fragments = [];
      syncFragments();
    }

    function resize() {
      const oldWidth = width;
      const oldHeight = height;

      width = innerWidth;
      height = innerHeight;

      const dpr = Math.min(devicePixelRatio || 1, 2);
      canvas.width = Math.round(width * dpr);
      canvas.height = Math.round(height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      for (const fragment of fragments) {
        fragment.x *= width / oldWidth;
        fragment.y *= height / oldHeight;
      }

      if (!fragments.length) reset();
    }

    function noise(seed, position, clock) {
      return (
        Math.sin(position * 19.7 + seed + clock * 1.3) * 0.5 +
        Math.sin(position * 43.1 + seed * 2.7 - clock * 2.1) * 0.3 +
        Math.sin(position * 83.3 - seed * 0.4 + clock * 0.7) * 0.2
      );
    }

    function drawGrid() {
      if (!config.appearance.gridOpacity) return;

      ctx.strokeStyle = rgba(
        config.appearance.signalColor,
        config.appearance.gridOpacity
      );
      ctx.lineWidth = 0.5;
      ctx.beginPath();

      const spacing = 90;

      for (let x = 0; x < width; x += spacing) {
        for (let y = 0; y < height; y += spacing) {
          ctx.moveTo(x - 3, y);
          ctx.lineTo(x + 3, y);
          ctx.moveTo(x, y - 3);
          ctx.lineTo(x, y + 3);
        }
      }

      ctx.stroke();
    }

    function drawWave(fragment, w, h, coherence, clock) {
      const segments = 72;
      const corruption = config.signals.noise * (1 - coherence);
      let connected = false;

      ctx.beginPath();

      for (let i = 0; i <= segments; i++) {
        const u = i / segments;
        const carrier =
          Math.sin(
            u * Math.PI * 8 * config.signals.frequency -
            clock * 2 +
            fragment.phase
          );

        const envelope = Math.sin(u * Math.PI);
        const disturbance = noise(fragment.seed, u, clock);

        const x = (u - 0.5) * w;
        const y =
          (carrier * 0.55 + disturbance * corruption) *
          envelope *
          h * 0.45;

        const gap =
          Math.sin(u * 59 + fragment.seed + Math.floor(clock * 2)) >
          0.9 - corruption * 0.65;

        if (gap && coherence < 0.9) {
          connected = false;
          continue;
        }

        if (connected) ctx.lineTo(x, y);
        else ctx.moveTo(x, y);

        connected = true;
      }

      ctx.stroke();

      ctx.globalAlpha *= 0.45;
      ctx.beginPath();
      ctx.moveTo(-w / 2, h * 0.58);
      ctx.lineTo(w / 2, h * 0.58);

      for (let i = 0; i <= 12; i++) {
        const x = -w / 2 + w * i / 12;
        ctx.moveTo(x, h * 0.58);
        ctx.lineTo(x, h * 0.58 + (i % 3 ? 3 : 6));
      }

      ctx.stroke();
    }

    function drawDiagram(fragment, w, h, coherence, clock) {
      const points = [];

      for (let i = 0; i < 7; i++) {
        const u = i / 6;
        const jitter = (1 - coherence) * config.signals.noise;

        points.push({
          x: (u - 0.5) * w +
            noise(fragment.seed + 5, u, clock) * 9 * jitter,
          y: Math.sin(i * 1.8 + fragment.phase) * h * 0.36 +
            noise(fragment.seed, u, clock) * h * 0.25 * jitter
        });
      }

      ctx.beginPath();

      points.forEach((point, i) => {
        if (!i) return;

        const broken =
          Math.sin(fragment.seed + i * 8 + Math.floor(clock)) >
          -0.25 + coherence * 1.2;

        if (broken) return;

        const previousPoint = points[i - 1];
        const middle = (previousPoint.x + point.x) / 2;

        ctx.moveTo(previousPoint.x, previousPoint.y);
        ctx.lineTo(middle, previousPoint.y);
        ctx.lineTo(middle, point.y);
        ctx.lineTo(point.x, point.y);
      });

      ctx.stroke();

      for (const point of points) {
        ctx.strokeRect(point.x - 2.5, point.y - 2.5, 5, 5);
      }

      if (coherence > 0.25) {
        ctx.globalAlpha *= coherence;
        ctx.beginPath();
        ctx.arc(0, 0, h * 0.62, 0, Math.PI * 2);
        ctx.stroke();
      }
    }

    function drawSpectrum(fragment, w, h, coherence, clock) {
      const bars = 30;

      ctx.beginPath();

      for (let i = 0; i < bars; i++) {
        const u = i / (bars - 1);
        const peakA = Math.exp(-Math.pow((u - 0.3) / 0.08, 2));
        const peakB = Math.exp(-Math.pow((u - 0.7) / 0.12, 2));

        const stable = 0.1 + peakA * 0.85 + peakB * 0.55;
        const interference =
          Math.abs(noise(fragment.seed, u, clock)) *
          config.signals.noise;

        const amplitude =
          stable * (0.25 + coherence * 0.75) +
          interference * (1 - coherence);

        const x = (u - 0.5) * w;

        ctx.moveTo(x, h * 0.45);
        ctx.lineTo(x, h * 0.45 - amplitude * h);
      }

      ctx.stroke();
    }

    function drawFragment(fragment, dt) {
      const w = config.signals.width * fragment.scale;
      const h = config.signals.height * fragment.scale;

      fragment.x -= config.signals.speed * fragment.drift * dt;
      fragment.y += Math.sin(time * 0.12 + fragment.phase) * dt * 2;

      const margin = Math.max(w, h) + 40;

      if (fragment.x < -margin) fragment.x = width + margin;
      if (fragment.y < -margin) fragment.y = height + margin;
      if (fragment.y > height + margin) fragment.y = -margin;

      const distance = Math.hypot(
        fragment.x - mouse.x,
        fragment.y - mouse.y
      );

      const proximity = clamp(
        1 - distance / config.tuning.radius,
        0,
        1
      );

      const target = config.tuning.enabled
        ? proximity * proximity *
          mouse.influence * config.tuning.strength
        : 0;

      const rate = target > fragment.tuning
        ? config.tuning.smoothing
        : config.tuning.release;

      fragment.tuning +=
        (clamp(target, 0, 1) - fragment.tuning) *
        (1 - Math.exp(-rate * dt));

      const coherence = fragment.tuning;
      const clock = time + fragment.phase;

      const ageCycle =
        0.5 + 0.5 * Math.sin(time * 0.16 + fragment.phase);

      const persistence =
        1 - config.signals.decay * (1 - ageCycle);

      const flicker =
        1 - config.signals.flicker * (1 - coherence) *
        (0.5 + 0.5 * Math.sin(clock * 7 + fragment.seed));

      const opacity = clamp(
        config.appearance.opacity * persistence * flicker +
        coherence * 0.5,
        0,
        1
      );

      const color = mix(
        config.appearance.signalColor,
        config.appearance.tunedColor,
        coherence
      );

      ctx.save();
      ctx.translate(fragment.x, fragment.y);

      ctx.strokeStyle = rgba(color);
      ctx.fillStyle = rgba(color);
      ctx.globalAlpha = opacity;
      ctx.lineWidth = config.appearance.lineWidth;
      ctx.shadowColor = rgba(color);
      ctx.shadowBlur = config.appearance.glow * coherence;

      if (fragment.type === 0) {
        drawWave(fragment, w, h, coherence, clock);
      } else if (fragment.type === 1) {
        drawDiagram(fragment, w, h, coherence, clock);
      } else {
        drawSpectrum(fragment, w, h, coherence, clock);
      }

      ctx.globalAlpha = opacity;
      ctx.shadowBlur = 0;

      if (config.appearance.labels) {
        ctx.font = "9px ui-monospace, monospace";
        ctx.fillStyle = rgba(
          coherence > 0.5
            ? config.appearance.accentColor
            : color
        );

        const status = coherence > 0.65 ? "LOCK" : "SCAN";
        const coordinate =
          `${(fragment.seed % 90).toFixed(2)} / ` +
          `${((fragment.seed * 1.73) % 180).toFixed(2)}`;

        ctx.fillText(
          `${status} ${fragment.code}`,
          -w / 2,
          -h * 0.7 - 8
        );

        ctx.globalAlpha *= 0.6;
        ctx.fillText(coordinate, -w / 2, h * 0.65 + 18);
      }

      ctx.restore();
    }

    function drawTuningField() {
      if (
        !config.tuning.enabled ||
        !config.tuning.showField ||
        mouse.influence < 0.01
      ) return;

      const radius = config.tuning.radius;

      const gradient = ctx.createRadialGradient(
        mouse.x, mouse.y, 0,
        mouse.x, mouse.y, radius
      );

      gradient.addColorStop(
        0,
        rgba(config.appearance.tunedColor, mouse.influence * 0.045)
      );
      gradient.addColorStop(
        0.65,
        rgba(config.appearance.signalColor, mouse.influence * 0.018)
      );
      gradient.addColorStop(1, rgba(config.appearance.signalColor, 0));

      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, width, height);

      ctx.strokeStyle = rgba(
        config.appearance.tunedColor,
        mouse.influence * 0.1
      );
      ctx.lineWidth = 0.6;

      ctx.beginPath();
      ctx.arc(mouse.x, mouse.y, radius * 0.32, 0, Math.PI * 2);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(mouse.x - 7, mouse.y);
      ctx.lineTo(mouse.x + 7, mouse.y);
      ctx.moveTo(mouse.x, mouse.y - 7);
      ctx.lineTo(mouse.x, mouse.y + 7);
      ctx.stroke();
    }

    function frame(timestamp) {
      const realDt = previous === null
        ? 0
        : Math.min((timestamp - previous) / 1000, 0.05);

      previous = timestamp;

      const still =
        config.animation.paused ||
        (config.animation.respectReducedMotion && reducedMotion.matches);

      const dt = still ? 0 : realDt * config.animation.speed;
      time += dt;

      const smoothing =
        1 - Math.exp(-config.tuning.smoothing * realDt);

      mouse.x += (mouse.targetX - mouse.x) * smoothing;
      mouse.y += (mouse.targetY - mouse.y) * smoothing;

      mouse.influence +=
        ((mouse.active ? 1 : 0) - mouse.influence) *
        (1 - Math.exp(-config.tuning.smoothing * realDt));

      ctx.fillStyle = rgba(config.appearance.backgroundColor);
      ctx.fillRect(0, 0, width, height);

      drawGrid();
      drawTuningField();

      for (const fragment of fragments) {
        // Tuning remains responsive when ambient motion is paused.
        drawFragment(fragment, dt);
      }

      requestAnimationFrame(frame);
    }

    function updatePointer(event) {
      if (event.target.closest?.("[data-background-editor]")) {
        mouse.active = false;
        return;
      }

      if (!mouse.active) {
        mouse.x = event.clientX;
        mouse.y = event.clientY;
      }

      mouse.targetX = event.clientX;
      mouse.targetY = event.clientY;
      mouse.active = true;
    }

    addEventListener("pointermove", updatePointer);
    addEventListener("pointerdown", updatePointer);
    addEventListener("pointerup", event => {
      if (event.pointerType !== "mouse") mouse.active = false;
    });
    addEventListener("pointercancel", () => mouse.active = false);
    document.documentElement.addEventListener(
      "pointerleave",
      () => mouse.active = false
    );
    addEventListener("blur", () => mouse.active = false);

    document.addEventListener("visibilitychange", () => {
      previous = null;
      mouse.active = false;
    });

    addEventListener("resize", resize);

    resize();
    requestAnimationFrame(frame);

    if (config.panel.enabled) {
      import("./settings-editor.js")
        .then(({ createSettingsEditor }) => {
          createSettingsEditor({
            config,
            onChange: syncFragments,
            onReset: reset
          });
        })
        .catch(error => console.error("Editor could not load:", error));
    }
  </script>
</body>
</html>
