    return {texture,fbo,w,h};
  }

  function disposeTarget(target){
    if(!target)return;
    gl.deleteTexture(target.texture);gl.deleteFramebuffer(target.fbo);
  }

  function ensureTargets(){
    const w=canvas.width,h=canvas.height;
    if(sceneTarget?.w===w&&sceneTarget?.h===h)return;
    disposeTarget(sceneTarget);disposeTarget(brightTarget);disposeTarget(blurTarget);
    sceneTarget=makeTarget(w,h);
    brightTarget = makeTarget(w, h);
    blurTarget=makeTarget(brightTarget.w,brightTarget.h);
  }

  function quad(program,source,unit=0,uniformName='u_texture'){
    gl.useProgram(program);
    gl.activeTexture(gl.TEXTURE0+unit);
    gl.bindTexture(gl.TEXTURE_2D,source);
    gl.uniform1i(gl.getUniformLocation(program,uniformName),unit);
    gl.bindVertexArray(quadVAO);
    gl.drawArrays(gl.TRIANGLES,0,6);
  }

  function postprocess(){
    const fx=config.cinematic;
    gl.disable(gl.BLEND);
    gl.bindFramebuffer(gl.FRAMEBUFFER,brightTarget.fbo);
    gl.viewport(0,0,brightTarget.w,brightTarget.h);
    gl.useProgram(extractProgram);
    gl.uniform1f(uniform(extractProgram,'u_threshold'),fx.bloomThreshold);
    quad(extractProgram,sceneTarget.texture);

    for(let i=0;i<2;i++){
      gl.bindFramebuffer(gl.FRAMEBUFFER,blurTarget.fbo);
      gl.useProgram(blurProgram);
      gl.uniform2f(uniform(blurProgram,'u_direction'),1/brightTarget.w,0);
      gl.uniform1f(uniform(blurProgram,'u_radius'),fx.bloomRadius);
      quad(blurProgram,brightTarget.texture);

      gl.bindFramebuffer(gl.FRAMEBUFFER,brightTarget.fbo);
      gl.useProgram(blurProgram);
      gl.uniform2f(uniform(blurProgram,'u_direction'),0,1/brightTarget.h);
      gl.uniform1f(uniform(blurProgram,'u_radius'),fx.bloomRadius);
      quad(blurProgram,blurTarget.texture);
    }

    gl.bindFramebuffer(gl.FRAMEBUFFER,null);
    gl.viewport(0,0,canvas.width,canvas.height);
    gl.useProgram(compositeProgram);
    gl.uniform1f(uniform(compositeProgram,'u_strength'),fx.bloomStrength);
    gl.uniform1f(uniform(compositeProgram,'u_exposure'),fx.exposure);
    gl.uniform1f(uniform(compositeProgram,'u_vignette'),fx.vignette);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D,sceneTarget.texture);
    gl.uniform1i(uniform(compositeProgram,'u_scene'),0);
    gl.activeTexture(gl.TEXTURE1);
    gl.bindTexture(gl.TEXTURE_2D,brightTarget.texture);
    gl.uniform1i(uniform(compositeProgram,'u_bloom'),1);
    gl.bindVertexArray(quadVAO);
    gl.drawArrays(gl.TRIANGLES,0,6);
  }

  const linesProgram=program(lineVertex,lineFragment);
  const nebulaProgram=program(quadVertex,quadFragment);
  const starBuffer=gl.createBuffer(), lineBuffer=gl.createBuffer();
  const starVAO=gl.createVertexArray(),lineVAO=gl.createVertexArray(),quadVAO=gl.createVertexArray();

  gl.bindVertexArray(starVAO);gl.bindBuffer(gl.ARRAY_BUFFER,starBuffer);
  gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,4,gl.FLOAT,false,32,0);
  gl.enableVertexAttribArray(1);gl.vertexAttribPointer(1,4,gl.FLOAT,false,32,16);
  gl.bindVertexArray(lineVAO);gl.bindBuffer(gl.ARRAY_BUFFER,lineBuffer);
  gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,2,gl.FLOAT,false,24,0);
  gl.enableVertexAttribArray(1);gl.vertexAttribPointer(1,4,gl.FLOAT,false,24,8);
  gl.bindVertexArray(null);

  const texture=gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D,texture);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,false);
  let nebulaDirty=true;
  const maxPointSize=gl.getParameter(gl.ALIASED_POINT_SIZE_RANGE)[1];

  function uniform(program,name) { return gl.getUniformLocation(program,name); }

  function uploadNebula() {
    gl.bindTexture(gl.TEXTURE_2D,texture);
    gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,nebulaCanvas);
    nebulaDirty=false;
  }

  function background(lights) {
    const c=config.appearance.backgroundColor;
    gl.clearColor(c[0]/255,c[1]/255,c[2]/255,1);
    gl.clear(gl.COLOR_BUFFER_BIT);
    if(!config.nebula.enabled || config.nebula.opacity<=0) return;
    if(nebulaDirty) uploadNebula();
    gl.useProgram(nebulaProgram);
    gl.uniform1f(uniform(nebulaProgram,'u_opacity'),config.nebula.opacity);
    gl.uniform1f(uniform(nebulaProgram,'u_time'),config.nebula.living ? time : 0);
    gl.uniform1f(uniform(nebulaProgram,'u_drift'),config.nebula.living ? config.nebula.driftSpeed : 0);
    gl.uniform1f(uniform(nebulaProgram,'u_distortion'),config.nebula.living ? config.nebula.distortion : 0);
    gl.uniform1f(uniform(nebulaProgram,'u_lighting'),config.nebula.stellarLighting);
    gl.uniform3fv(uniform(nebulaProgram,'u_lights[0]'),lights);
    gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,texture);
    gl.uniform1i(uniform(nebulaProgram,'u_texture'),0);
    gl.bindVertexArray(quadVAO);
    gl.blendFunc(gl.ONE,gl.ONE_MINUS_SRC_ALPHA);
    gl.drawArrays(gl.TRIANGLES,0,6);
  }

  function drawLines(data) {
    if(!data.length)return;
    gl.useProgram(linesProgram);
    gl.uniform2f(uniform(linesProgram,'u_resolution'),width,height);
    gl.bindVertexArray(lineVAO);
    gl.bindBuffer(gl.ARRAY_BUFFER,lineBuffer);
    gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(data),gl.DYNAMIC_DRAW);
    gl.blendFunc(gl.ONE,gl.ONE_MINUS_SRC_ALPHA);
    gl.drawArrays(gl.LINES,0,data.length/6);
  }

  function drawStars(data) {
    if(!data.length)return;
    gl.useProgram(starsProgram);
    gl.uniform2f(uniform(starsProgram,'u_resolution'),width,height);
    gl.uniform1f(uniform(starsProgram,'u_dpr'),canvas.width/width);
    gl.uniform1f(uniform(starsProgram,'u_maxPointSize'),maxPointSize);
    gl.bindVertexArray(starVAO);
    gl.bindBuffer(gl.ARRAY_BUFFER,starBuffer);
    gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(data),gl.DYNAMIC_DRAW);
    gl.blendFunc(gl.ONE,gl.ONE_MINUS_SRC_ALPHA);
    gl.drawArrays(gl.POINTS,0,data.length/8);
  }

  function render(starData,lineData,lights) {
    if(config.cinematic.enabled){
      ensureTargets();
      gl.bindFramebuffer(gl.FRAMEBUFFER,sceneTarget.fbo);
    } else {
      gl.bindFramebuffer(gl.FRAMEBUFFER,null);
    }
    gl.viewport(0,0,canvas.width,canvas.height);
    gl.disable(gl.DEPTH_TEST);
    gl.enable(gl.BLEND);
    background(lights);
    drawLines(lineData);
    drawStars(starData);
    gl.bindVertexArray(null);
    gl.disable(gl.BLEND);
    if(config.cinematic.enabled)postprocess();
  }

  return {render, nebulaChanged(){nebulaDirty=true;}};
})();

function pushLine(target,x1,y1,x2,y2,color,alpha1,alpha2=alpha1) {
  if (![x1,y1,x2,y2].every(Number.isFinite))return;
  const r=color[0]/255,g=color[1]/255,b=color[2]/255;
  target.push(x1,y1,r,g,b,alpha1,x2,y2,r,g,b,alpha2);
}

function resize() {
  width = innerWidth;
  height = innerHeight;

  const dpr = Math.min(devicePixelRatio || 1, 2);
  canvas.width = Math.round(width * dpr);
  canvas.height = Math.round(height * dpr);
  gl.viewport(0, 0, canvas.width, canvas.height);

  buildNebula();
}


function rotateWorld(point) {
  const cx = Math.cos(rotation.x), sx = Math.sin(rotation.x);
  const cy = Math.cos(rotation.y), sy = Math.sin(rotation.y);
  const cz = Math.cos(rotation.z), sz = Math.sin(rotation.z);

  let x = point.x, y = point.y, z = point.z;

  let yy = y * cx - z * sx;
  let zz = y * sx + z * cx;
  y = yy; z = zz;

  let xx = x * cy + z * sy;
  zz = -x * sy + z * cy;
  x = xx; z = zz;

  xx = x * cz - y * sz;
  yy = x * sz + y * cz;
  x = xx; y = yy;

  return { x, y, z };
}

function inverseRotate(vector) {
  const cx = Math.cos(-rotation.x), sx = Math.sin(-rotation.x);
  const cy = Math.cos(-rotation.y), sy = Math.sin(-rotation.y);
  const cz = Math.cos(-rotation.z), sz = Math.sin(-rotation.z);

  let x = vector.x, y = vector.y, z = vector.z;

  let xx = x * cz - y * sz;
  let yy = x * sz + y * cz;
  x = xx; y = yy;

  xx = x * cy + z * sy;
  let zz = -x * sy + z * cy;
  x = xx; z = zz;

  yy = y * cx - z * sx;
  zz = y * sx + z * cx;
  y = yy; z = zz;

  return { x, y, z };
}

function updateFlight(dt) {
  if (!config.flight.enabled) {
    flightWasEnabled = false;
    flightState.initialized = false;
    return;
  }

  if (!stars.length) return;

  if (!followedStar || !stars.includes(followedStar)) {
    followedStar = stars[0];
    flightState.initialized = false;
  }

  const star = followedStar;
  const velocity = normalize(
    { x: star.vx, y: star.vy, z: star.vz },
    flightState.forward
  );

  const targetPosition = {
    x: star.x - velocity.x * config.flight.followDistance,
    y: star.y - velocity.y * config.flight.followDistance +
       config.flight.heightOffset,
    z: star.z - velocity.z * config.flight.followDistance
  };

  const targetForward = velocity;

  let targetRight = normalize(
    cross(targetForward, { x: 0, y: 1, z: 0 }),
    { x: 1, y: 0, z: 0 }
  );

  const targetUp = normalize(
    cross(targetRight, targetForward),
    { x: 0, y: 1, z: 0 }
  );

  if (!flightState.initialized || !flightWasEnabled) {
    flightState.position = targetPosition;
    flightState.forward = targetForward;
    flightState.up = targetUp;
    flightState.initialized = true;
  } else {
    const positionAmount =
      1 - Math.exp(-config.flight.positionSmoothing * dt);

    const directionAmount =
      1 - Math.exp(-config.flight.directionSmoothing * dt);

    flightState.position = smoothVector(
      flightState.position,
      targetPosition,
      positionAmount
    );

    flightState.forward = normalize(
      smoothVector(
        flightState.forward,
        targetForward,
        directionAmount
      ),
      targetForward
    );

    flightState.up = normalize(
      smoothVector(
        flightState.up,
        targetUp,
        directionAmount
      ),
      targetUp
    );
  }

  flightWasEnabled = true;
}

function makeView() {
  if (config.flight.enabled && flightState.initialized) {
    const forward = normalize(flightState.forward);
    let right = normalize(
      cross(forward, flightState.up),
      { x: 1, y: 0, z: 0 }
    );
    const up = normalize(cross(right, forward));

    return {
      flight: true,
      position: flightState.position,
      forward,
      right,
      up,
      focal: height /
        (2 * Math.tan(radians(config.flight.fieldOfView) / 2)),
      near: config.flight.nearClip
    };
  }

  return {
    flight: false,
    focal: Math.min(width, height) * config.camera.zoom,
    distance: config.camera.distance,
    near: 1
  };
}

function project(point) {
  if (view.flight) {
    const relative = {
      x: point.x - view.position.x,
      y: point.y - view.position.y,
      z: point.z - view.position.z
    };

    const depth = dot(relative, view.forward);

    if (depth <= view.near) return null;

    const scale = view.focal / depth;

    return {
      x: width / 2 + dot(relative, view.right) * scale,
      y: height / 2 - dot(relative, view.up) * scale,
      scale,
      depth
    };
  }

  const p = rotateWorld(point);
  const depth = view.distance - p.z;

  if (depth <= view.near) return null;

  const scale = view.focal / depth;

  return {
    x: width / 2 + p.x * scale,
    y: height / 2 - p.y * scale,
    scale,
    depth
  };
}

function screenForce(x, y) {
  const dx = mouse.x - x;
  const dy = mouse.y - y;
  const distance = Math.hypot(dx, dy);

  if (distance >= config.mouse.radius || distance < 0.001) {
    return null;
  }

  const falloff = Math.pow(
    1 - distance / config.mouse.radius,
    2
  );

  return {
    x: dx / distance,
    y: dy / distance,
    falloff
  };
}

function confine(star, allowExplosion = false) {
  const radius = Math.max(
    10,
    config.space.radius - starRadius(star.mass)
  );

  if (config.space.sphereBoundary) {
    const distance = Math.hypot(star.x, star.y, star.z);

    if (distance <= radius) return false;

    const nx = star.x / distance;
    const ny = star.y / distance;
    const nz = star.z / distance;

    star.x = nx * radius;
    star.y = ny * radius;
    star.z = nz * radius;

    const outward =
      star.vx * nx +
      star.vy * ny +
      star.vz * nz;

    if (outward > 0) {
      if (
        allowExplosion &&
        config.explosions.enabled &&
        config.explosions.boundaryExplosion &&
        star.cooldown <= 0
      ) {
        return true;
      }

      const impulse =
        outward * (1 + config.space.boundaryBounce);

      star.vx -= nx * impulse;
      star.vy -= ny * impulse;
      star.vz -= nz * impulse;
    }
  } else {
    for (const axis of ["x", "y", "z"]) {
      if (axis === "z" && !config.space.threeD) continue;

      if (star[axis] > radius) {
        star[axis] -= radius * 2;
      }

      if (star[axis] < -radius) {
        star[axis] += radius * 2;
      }
    }
  }

  return false;
}

function confineBoundaryBounce(star) {
  // Confine newly created fragments without triggering
  // another boundary explosion.
  return confine(star, false);
}

function merge(a, b) {
  if (!a || !b || a === b) return;

  const mass = a.mass + b.mass;

  a.vx = (a.vx * a.mass + b.vx * b.mass) / mass;
  a.vy = (a.vy * a.mass + b.vy * b.mass) / mass;
  a.vz = (a.vz * a.mass + b.vz * b.mass) / mass;

  a.x = (a.x * a.mass + b.x * b.mass) / mass;
  a.y = (a.y * a.mass + b.y * b.mass) / mass;
  a.z = (a.z * a.mass + b.z * b.mass) / mass;

  a.mass = mass;
  a.cooldown = Math.max(a.cooldown, b.cooldown);
  a.criticalAge = 0;
  a.wait = config.explosions.delay +
    random(0, config.explosions.delayVariation);

  limitVelocity(a);
}

function emitNovaVisuals(star) {
  const count = Math.round(config.explosions.visualParticles);

  for (let i = 0; i < count; i++) {
    const d = direction();
    const speed = random(25, 145);

    sparks.push({
      x: star.x, y: star.y, z: star.z,
      vx: d.x * speed, vy: d.y * speed, vz: d.z * speed,
      life: config.explosions.particleLifetime * random(0.5, 1.25),
      maxLife: config.explosions.particleLifetime * 1.25,
      size: random(0.5, 2.5),
      phase: random(0, Math.PI * 2),
      color: mix(config.appearance.hotColor, config.appearance.giantColor, Math.random())
    });
  }
}

function explode(star, available) {
  const count = Math.min(
    Math.round(config.explosions.fragments),
    Math.max(0, available)
  );

  if (count < 2) return null;

  emitNovaVisuals(star);

  const fragments = [];
  const mass = star.mass / count;

  for (let i = 0; i < count; i++) {
    const d = direction();

    const fragment = makeStar(
      {
        x: star.x + d.x * starRadius(star.mass),
        y: star.y + d.y * starRadius(star.mass),
        z: star.z + d.z * starRadius(star.mass)
      },
      mass
    );

    fragment.vx =
      star.vx + d.x * config.explosions.speed;

    fragment.vy =
      star.vy + d.y * config.explosions.speed;

    fragment.vz =
      star.vz + d.z * config.explosions.speed;

    fragment.cooldown = config.explosions.cooldown;

    confineBoundaryBounce(fragment);
    limitVelocity(fragment);

    fragments.push(fragment);
  }

  rings.push({
    x: star.x,
    y: star.y,
    z: star.z,
    radius: starRadius(star.mass),
    life: 0,
    maxLife: 1.4,
    strength: config.explosions.shockwaveStrength,
    flash: config.explosions.flashIntensity
  });

  return fragments;
}

function simulate(dt) {
  if (!stars.length) return;

  const range = config.gravity.range;
  const rangeSquared = range * range;
  const softeningSquared =
    config.gravity.softening * config.gravity.softening;

  const acceleration = stars.map(() => ({
    x: 0, y: 0, z: 0
  }));

  // Pairwise gravitational attraction.
  for (let i = 0; i < stars.length; i++) {
    const a = stars[i];

    for (let j = i + 1; j < stars.length; j++) {
      const b = stars[j];

      const dx = b.x - a.x;
      const dy = b.y - a.y;
      const dz = config.space.threeD ? b.z - a.z : 0;

      const distanceSquared =
        dx * dx + dy * dy + dz * dz;

      if (distanceSquared > rangeSquared) continue;

      const softened =
        distanceSquared + softeningSquared;

      const inverseDistance =
        1 / Math.sqrt(softened);

      const force =
        config.gravity.strength /
        softened * inverseDistance;

      acceleration[i].x += dx * force * b.mass;
      acceleration[i].y += dy * force * b.mass;
      acceleration[i].z += dz * force * b.mass;

      acceleration[j].x -= dx * force * a.mass;
      acceleration[j].y -= dy * force * a.mass;
      acceleration[j].z -= dz * force * a.mass;
    }
  }

  // Update velocities and positions.
  const boundaryExplosions = new Set();

  for (let i = 0; i < stars.length; i++) {
    const star = stars[i];
    const a = acceleration[i];

    star.vx += a.x * dt;
    star.vy += a.y * dt;
    star.vz += a.z * dt;

    limitVelocity(star);

    star.x += star.vx * dt;
    star.y += star.vy * dt;
    star.z += star.vz * dt;

    star.cooldown = Math.max(0, star.cooldown - dt);

    if (confine(star, true)) {
      boundaryExplosions.add(star);
    }

    if (
      config.explosions.enabled &&
      star.mass >= config.explosions.criticalMass
    ) {
      star.criticalAge += dt;
    } else {
      star.criticalAge = 0;
    }
  }

  // Detect merging stars.
  const removed = new Set();

  for (let i = 0; i < stars.length; i++) {
    const a = stars[i];

    if (removed.has(a) || boundaryExplosions.has(a)) {
      continue;
    }

    for (let j = i + 1; j < stars.length; j++) {
      const b = stars[j];

      if (
        removed.has(b) ||
        boundaryExplosions.has(b) ||
        a.cooldown > 0 ||
        b.cooldown > 0
      ) {
        continue;
      }

      const distance = Math.hypot(
        b.x - a.x,
        b.y - a.y,
        config.space.threeD ? b.z - a.z : 0
      );

      const collisionDistance =
        (starRadius(a.mass) + starRadius(b.mass)) *
        config.gravity.mergeDistance;

      if (distance < collisionDistance) {
        merge(a, b);
        removed.add(b);
      }
    }
  }

  if (removed.size) {
    stars = stars.filter(star => !removed.has(star));
  }

  // Advance expanding nova shockwaves.
  for (const ring of rings) {
    if (ring.type === "pointer") { ring.age += dt; continue; }
    ring.life += dt;
    ring.radius += 200 * dt;

    for (const star of stars) {
      const dx = star.x - ring.x;
      const dy = star.y - ring.y;
      const dz = star.z - ring.z;

      const distance = Math.hypot(dx, dy, dz);

      if (
        distance > 0.001 &&
        Math.abs(distance - ring.radius) < 30
      ) {
        const impulse =
          ring.strength * dt /
          Math.max(1, distance);

        star.vx += dx * impulse;
        star.vy += dy * impulse;
        star.vz += dz * impulse;

        limitVelocity(star);
      }
    }
  }

  rings = rings.filter(ring => ring.type === "pointer" ? ring.age < 1.4 : ring.life < ring.maxLife);

  // Update visual-only nova debris.
  for (const spark of sparks) {
    spark.life -= dt;

    spark.x += spark.vx * dt;
    spark.y += spark.vy * dt;
    spark.z += spark.vz * dt;

    const drag = Math.exp(-0.8 * dt);

    spark.vx *= drag;
    spark.vy *= drag;
    spark.vz *= drag;
  }

  sparks = sparks.filter(spark => spark.life > 0);

  // Replace exploding stars with nova fragments.
  const original = stars;
  const next = [];

  let population = original.length;

  for (const star of original) {
    const boundaryHit = boundaryExplosions.has(star);

    const normalNova =
      config.explosions.enabled &&
      star.mass >= config.explosions.criticalMass &&
      star.cooldown <= 0 &&
      star.criticalAge >= star.wait;

    if (boundaryHit || normalNova) {
      const available =
        Math.round(config.stars.maxCount) -
        population + 1;

      const fragments = explode(star, available);

      if (fragments) {
        next.push(...fragments);
        population += fragments.length - 1;
        continue;
      }
    }

    next.push(star);
  }

  stars = next;
}


function drawBoundary(lines) {
  if (!config.camera.showBoundary || !config.space.sphereBoundary) return;
  for (let plane = 0; plane < 3; plane++) {
    let previousPoint = null;
    for (let i = 0; i <= 160; i++) {
      const angle = i / 160 * Math.PI * 2;
      const a = Math.cos(angle) * config.space.radius;
      const b = Math.sin(angle) * config.space.radius;
      const point = plane === 0 ? {x:a,y:b,z:0} :
        plane === 1 ? {x:a,y:0,z:b} : {x:0,y:a,z:b};
      const screen = project(point);
      if (previousPoint && screen) {
        pushLine(lines,previousPoint.x,previousPoint.y,screen.x,screen.y,
          [160,190,240],0.12);
      }
      previousPoint = screen;
    }
  }
}
function draw() {
  const points = [], lines = [];
  const brightest = [];
  drawBoundary(lines);
  const projected = stars
    .filter(star => !(view.flight && star === followedStar))
    .map(star => ({star,screen:project(star)}))
    .filter(item => item.screen);
  // GPU batching means no per-star canvas gradient or draw call.
  for (const {star,screen} of projected) {
    const glowing = clamp(
      (star.mass-config.explosions.glowMass) /
      Math.max(1,config.explosions.criticalMass-config.explosions.glowMass),0,1);
    // Stellar personality: hot blue/white dwarfs, golden mid-mass stars,
    // warm giants, and pulsating unstable supergiants.
    const heat = Math.min(1, star.mass / Math.max(2, config.explosions.criticalMass));
    const stellarPalette = mix(
      mix([135,185,255], [255,240,202], clamp(star.mass / 5,0,1)),
      [255,122,66], clamp((star.mass-5)/15,0,1));
    const color = mix(
      mix(config.appearance.starColor, stellarPalette, config.stars.colorVariation),
      config.appearance.hotColor,
      clamp(star.criticalAge/Math.max(1,star.wait),0,1));
    const radius = clamp(starRadius(star.mass)*screen.scale,0.45,70);
    const depthReference = view.flight ? config.space.radius*0.65 : config.camera.distance;
    const depthAlpha = clamp(depthReference/screen.depth,0.15,1);
    const instability = star.criticalAge>0 ? 1+Math.sin(time*5+star.phase)*0.12 : 1;
    const twinkle = config.cinematic.enabled
      ? 1 + config.cinematic.twinkle*Math.sin(time*(1.5+star.phase%2)+star.phase*3)
      : 1;
    const halo = Math.max(radius,Math.min(220,
      radius*3+config.appearance.glow*screen.scale*(0.2+glowing)));
    if (screen.x < -halo || screen.x > width+halo ||
        screen.y < -halo || screen.y > height+halo) continue;
    if (star.mass > 3) {
      brightest.push({x:screen.x/width,y:1-screen.y/height,
        intensity:Math.min(1.7, star.mass/16)});
    }
    points.push(screen.x,screen.y,radius*instability*twinkle,halo,
      color[0]/255,color[1]/255,color[2]/255,
      clamp(config.stars.opacity*depthAlpha*twinkle,0,1));
    if(config.stars.trails>0) {
      const tail=project({
        x:star.x-star.vx*config.stars.trails,
        y:star.y-star.vy*config.stars.trails,
        z:star.z-star.vz*config.stars.trails
      });
      if(tail) pushLine(lines,tail.x,tail.y,screen.x,screen.y,color,
        0.03*depthAlpha,0.4*depthAlpha);
    }
  }
  for (const spark of sparks) {
    const screen = project(spark);
    if (!screen) continue;
    const fade = Math.pow(clamp(spark.life / spark.maxLife, 0, 1), 1.5);
    const r = Math.max(.4, spark.size * screen.scale);
    points.push(screen.x,screen.y,r,Math.max(r*3,3),
      spark.color[0]/255,spark.color[1]/255,spark.color[2]/255,fade*.85);
  }
  for (const ring of rings) {
    const screen=ring.type==='pointer'?ring:project(ring);
    if(!screen)continue;
    const elapsed = ring.type === 'pointer' ? ring.age : ring.life;
    const radius=Math.min(3000,ring.type==='pointer' ? elapsed*220 : ring.radius*screen.scale);
    const flash = config.explosions.flashIntensity;
    const alpha=clamp((1-elapsed/(ring.type==='pointer'?1.4:ring.maxLife))*0.2*flash,0,1);
    const segments=96;
    for(let i=0;i<segments;i++) {
      const a=i/segments*Math.PI*2,b=(i+1)/segments*Math.PI*2;
      pushLine(lines,screen.x+Math.cos(a)*radius,screen.y+Math.sin(a)*radius,
        screen.x+Math.cos(b)*radius,screen.y+Math.sin(b)*radius,
        config.appearance.hotColor,alpha);
    }
  }
  brightest.sort((a,b)=>b.intensity-a.intensity);
  const lights = new Float32Array(9);
  brightest.slice(0,3).forEach((light,i)=>{
    lights[i*3]=light.x;
    lights[i*3+1]=light.y;
    lights[i*3+2]=light.intensity;
  });
  GLRenderer.render(points,lines,lights);
  flightStatus.hidden = !config.flight.enabled || !config.flight.showStatus;
  if (!flightStatus.hidden && followedStar) {
    const speed=Math.hypot(followedStar.vx,followedStar.vy,followedStar.vz);
    flightStatus.textContent = `Riding star ${followedStar.id} · `+
      `Mass ${followedStar.mass.toFixed(1)} · `+
      `Speed ${speed.toFixed(1)} · ${stars.length} stars`;
  }
}

function frame(timestamp) {
  const realDt = previous === null
    ? 0
    : Math.min((timestamp - previous) / 1000, 0.1);

  previous = timestamp;

  const response =
    1 - Math.exp(-config.mouse.smoothing * realDt);

  mouse.x += (mouse.targetX - mouse.x) * response;
  mouse.y += (mouse.targetY - mouse.y) * response;

  mouse.influence +=
    ((mouse.active ? 1 : 0) - mouse.influence) * response;

  if (flightWasEnabled !== config.flight.enabled) {
    flightState.initialized = false;
    flightWasEnabled = config.flight.enabled;
  }

  if (config.flight.enabled && !flightState.initialized) {
    updateFlight(0);
  }

  const still =
    config.animation.paused ||
    (
      config.animation.respectReducedMotion &&
      reducedMotion.matches
    );

  if (still || config.animation.speed === 0) {
    physicsAccumulator = 0;
  } else {
    physicsAccumulator = Math.min(
      physicsAccumulator + realDt * config.animation.speed,
      physicsStep * maximumPhysicsSteps
    );

    let completedSteps = 0;

    while (
      physicsAccumulator >= physicsStep &&
      completedSteps < maximumPhysicsSteps
    ) {
      time += physicsStep;

      rotation.x += radians(config.camera.rotationSpeedX) * physicsStep;
      rotation.y += radians(config.camera.rotationSpeedY) * physicsStep;
      rotation.z += radians(config.camera.rotationSpeedZ) * physicsStep;

      view = makeView();
      simulate(physicsStep);

      if (config.flight.enabled) {
        updateFlight(physicsStep);
      }

      physicsAccumulator -= physicsStep;
      completedSteps++;
    }
  }

  view = makeView();
  draw();

  requestAnimationFrame(frame);
}

function pointer(event) {
  if (event.target.closest?.("[data-background-editor]")) {
    leave();
    return false;
  }

  if (!mouse.active) {
    mouse.x = event.clientX;
    mouse.y = event.clientY;
  }

  mouse.targetX = event.clientX;
  mouse.targetY = event.clientY;
  mouse.active = true;
  return true;
}

function leave() {
  mouse.active = false;
  mouse.held = false;
}

addEventListener("pointermove", pointer);

addEventListener("pointerdown", event => {
  if (!pointer(event) || !config.mouse.enabled) return;
  if (event.pointerType === "mouse" && event.button !== 0) return;

  mouse.held = true;

  rings.push({
    x: event.clientX,
    y: event.clientY,
    age: 0,
    type: "pointer"
  });

  if (rings.length > 25) rings.shift();
});

addEventListener("pointerup", event => {
  mouse.held = false;
  if (event.pointerType !== "mouse") mouse.active = false;
});

addEventListener("pointercancel", leave);
addEventListener("blur", leave);

document.documentElement.addEventListener("pointerleave", leave);

document.addEventListener("visibilitychange", () => {
  previous = null;
  leave();
});

addEventListener("resize", resize);

resize();
reset();
requestAnimationFrame(frame);

if (config.panel.enabled) {
  if (typeof window.createSettingsEditor === "function") {
    window.createSettingsEditor({
      config,
      onChange: refresh,
      onReset: reset,
      onNextStar: nextStar,
      onResetRotation: () => {
        rotation.x = 0;
        rotation.y = 0;
        rotation.z = 0;
      },
      onNebula: () => {
        nebulaSeed = Math.floor(Math.random() * 0xffffffff);
        buildNebula();
      }
    });
  } else {
    console.error("Settings editor is not available.");
  }
}
</script>
</body>
