
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Animated Background Gallery</title>
<style>
:root {
    color-scheme: dark;
    --accent: #91d8f5;
    --glass: rgba(8, 13, 23, .82);
    --border: rgba(255, 255, 255, .18);
}
* { box-sizing: border-box; }
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    color: #fff;
    font-family: system-ui, sans-serif;
}
button, input { font: inherit; }
button { color: inherit; cursor: pointer; }
button:disabled { opacity: .5; cursor: wait; }
button:focus-visible, a:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
}
[hidden] { display: none !important; }

#background {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    background: #000;
}
#shade {
    position: fixed;
    inset: 0;
    background: #000;
    opacity: 0;
    pointer-events: none;
    transition: opacity .3s;
}
#shade.active { opacity: .85; }

.gallery {
    position: fixed;
    inset: 0;
    pointer-events: none;
}
.gallery > * { pointer-events: auto; }
header {
    position: absolute;
    top: 22px;
    left: 50%;
    transform: translateX(-50%);
    width: min(550px, calc(100% - 30px));
    text-align: center;
    text-shadow: 0 2px 16px #000;
    pointer-events: none;
}
header h1 {
    margin: 0 0 5px;
    font-size: clamp(23px, 3vw, 35px);
    letter-spacing: -.04em;
}
header p {
    margin: 0;
    font-size: 12px;
    color: #ffffffb0;
}

.dock {
    position: absolute;
    left: 50%;
    bottom: max(16px, env(safe-area-inset-bottom));
    transform: translateX(-50%);
    width: min(1180px, calc(100% - 30px));
    border: 1px solid var(--border);
    border-radius: 19px;
    background: var(--glass);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    box-shadow: 0 15px 55px #0008;
}
.dock-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 13px 17px 8px;
}
.dock-title { flex: 1; min-width: 0; }
.eyebrow {
    display: block;
    margin-bottom: 3px;
    color: var(--accent);
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: .18em;
}
#current-name {
    display: block;
    font-size: 16px;
    font-weight: 600;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
}
.actions { display: flex; gap: 7px; }
.icon-button {
    display: inline-flex;
    justify-content: center;
    align-items: center;
    width: 34px;
    height: 34px;
    border: 1px solid var(--border);
    border-radius: 9px;
    background: #ffffff10;
    color: white;
    text-decoration: none;
    font-size: 18px;
}
.icon-button:hover { background: #ffffff28; }
.icon-button.active {
    border-color: var(--accent);
    color: var(--accent);
}

.carousel {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 0 10px 10px;
}
.arrow {
    flex: 0 0 28px;
    height: 50px;
    border: 0;
    background: transparent;
    font-size: 24px;
}
.track {
    display: flex;
    flex: 1;
    min-width: 0;
    gap: 10px;
    padding: 5px 3px 9px;
    overflow-x: auto;
    overflow-y: hidden;
    scroll-behavior: smooth;
    scroll-snap-type: x proximity;
    scrollbar-width: thin;
    scrollbar-color: #ffffff55 transparent;
}
.thumb {
    flex: 0 0 158px;
    width: 158px;
    padding: 0;
    border: 2px solid transparent;
    border-radius: 10px;
    background: #ffffff0b;
    text-align: left;
    overflow: hidden;
    scroll-snap-align: center;
    transition: border-color .2s, transform .2s;
}
.thumb:hover { transform: translateY(-3px); }
.thumb.selected {
    border-color: var(--accent);
    background: #91d8f51b;
}
.thumb-picture {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #0b1322;
    overflow: hidden;
}
.thumb-picture img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
}
.thumb-label {
    display: block;
    padding: 7px 9px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 11px;
}
.thumb.selected .thumb-label { color: var(--accent); }
.thumb-check {
    display: none;
    position: absolute;
    top: 5px;
    right: 5px;
    width: 21px;
    height: 21px;
    border-radius: 50%;
    background: var(--accent);
    color: #06111a;
    text-align: center;
    line-height: 21px;
    font-weight: bold;
}
.thumb.selected .thumb-check { display: block; }

.dock-footer {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding: 0 17px 13px;
}
#description {
    margin: 0;
    font-size: 11px;
    line-height: 1.5;
    color: #ffffffa8;
}
#count {
    flex: 0 0 auto;
    font-size: 10px;
    color: #ffffff80;
}

#show-gallery {
    position: fixed;
    left: 50%;
    bottom: 18px;
    transform: translateX(-50%);
    z-index: 10;
    padding: 12px 20px;
    border: 1px solid var(--border);
    border-radius: 30px;
    background: var(--glass);
    backdrop-filter: blur(15px);
}

.popover {
    position: absolute;
    right: 12px;
    bottom: calc(100% + 12px);
    width: min(330px, calc(100vw - 32px));
    padding: 18px;
    border: 1px solid var(--border);
    border-radius: 14px;
    background: rgba(8, 13, 23, .97);
    box-shadow: 0 15px 50px #0009;
}
.popover h2 { margin: 0 0 12px; font-size: 16px; }
.popover p {
    color: #ffffffaa;
    font-size: 12px;
    line-height: 1.5;
}
.popover label {
    display: flex;
    gap: 9px;
    margin: 14px 0;
    font-size: 12px;
    line-height: 1.5;
}
.popover input { accent-color: var(--accent); }
.primary {
    width: 100%;
    padding: 12px;
    border: 1px solid #91d8f566;
    border-radius: 9px;
    background: #91d8f526;
}
.primary:hover { background: #91d8f540; }
#status { overflow-wrap: anywhere; }

@media (max-width: 700px) {
    .dock { width: calc(100% - 16px); bottom: 8px; }
    .dock-header { padding: 10px 12px 7px; }
    .thumb { flex-basis: 132px; width: 132px; }
    .carousel { gap: 2px; padding: 0 5px 8px; }
    .arrow { flex-basis: 22px; }
    .dock-footer { padding: 0 12px 11px; }
    .icon-button { width: 32px; height: 32px; }
    #description { max-height: 45px; overflow: hidden; }
}
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        scroll-behavior: auto !important;
        transition-duration: 0s !important;
    }
}
</style>
</head>
<body>

<iframe id="background" title="Animated background"></iframe>
<div id="shade"></div>

<div class="gallery">
    <header id="gallery-header">
        <h1>A little moving magic.</h1>
        <p>Explore interactive animated backgrounds</p>
    </header>

    <section class="dock" id="dock" aria-label="Background gallery">
        <div class="dock-header">
            <div class="dock-title">
                <span class="eyebrow">Now playing</span>
                <span id="current-name"></span>
            </div>
            <div class="actions">
                <button class="icon-button" id="previous"
                    title="Previous background" aria-label="Previous">‹</button>
                <button class="icon-button" id="next"
                    title="Next background" aria-label="Next">›</button>
                <a class="icon-button" id="open-background"
                    title="Open in new tab" aria-label="Open background"
                    target="_blank" rel="noopener">↗</a>
                <button class="icon-button" id="settings"
                    title="Download options" aria-label="Download options"
                    aria-expanded="false">⚙</button>
                <button class="icon-button" id="hide"
                    title="Hide gallery" aria-label="Hide gallery">×</button>
            </div>
        </div>

        <div class="carousel">
            <button class="arrow" id="scroll-left"
                aria-label="Scroll left">‹</button>
            <div class="track" id="track"
                aria-label="Background thumbnails"></div>
            <button class="arrow" id="scroll-right"
                aria-label="Scroll right">›</button>
        </div>

        <div class="dock-footer">
            <p id="description"></p>
            <span id="count"></span>
        </div>

        <div class="popover" id="popover" hidden>
            <h2>Background options</h2>
            <p>Download the selected background with its current settings.</p>
            <label>
                <input id="editor-enabled" type="checkbox">
                <span>Enable settings editor in downloaded background</span>
            </label>
            <button class="primary" id="download">
                Download background ZIP ↓
            </button>
            <p id="status" role="status" aria-live="polite"></p>
        </div>
    </section>
</div>

<button id="show-gallery" hidden>Show gallery ↑</button>

<script type="module">
"use strict";

import { backgrounds } from "./backgrounds.js";

const $ = id => document.getElementById(id);
const frame = $("background");
const shade = $("shade");
const track = $("track");
const dock = $("dock");
const popover = $("popover");
const cards = new Map();
const storageKey = "background-gallery-selection";

let selectedIndex = 0;
let selectionVersion = 0;

function backgroundURL(folder) {
    return folder.split("/")
        .map(encodeURIComponent)
        .join("/") + "/index.html";
}

function thumbnailURL(folder) {
    return folder.split("/")
        .map(encodeURIComponent)
        .join("/") + "/thumbnail.webp";
}

function fallbackImage(folder) {
    const canvas = document.createElement("canvas");
    canvas.width = 480;
    canvas.height = 270;
    const ctx = canvas.getContext("2d");
    let seed = 2166136261;
    for (const char of folder) {
        seed = Math.imul(seed ^ char.charCodeAt(0), 16777619);
    }
    seed >>>= 0;
    const hue = seed % 360;
    const gradient = ctx.createLinearGradient(0, 0, 480, 270);
    gradient.addColorStop(0, `hsl(${hue}, 65%, 19%)`);
    gradient.addColorStop(1, `hsl(${(hue + 95) % 360}, 65%, 5%)`);
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, 480, 270);
    function random() {
        seed ^= seed << 13;
        seed ^= seed >>> 17;
        seed ^= seed << 5;
        return (seed >>> 0) / 4294967296;
    }
    for (let i = 0; i < 100; i++) {
        ctx.beginPath();
        ctx.arc(random() * 480, random() * 270,
            .4 + random() * 2, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255,255,255,${.2 + random() * .7})`;
        ctx.fill();
    }
    return canvas.toDataURL("image/png");
}

function makeCard(background, index) {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "thumb";
    button.title = background.description || background.name;
    button.setAttribute("aria-label", `Select ${background.name}`);
    button.setAttribute("aria-pressed", "false");

    const picture = document.createElement("div");
    picture.className = "thumb-picture";

    const image = document.createElement("img");
    image.alt = "";
    image.loading = "lazy";
    image.decoding = "async";
    image.src = thumbnailURL(background.folder);

    // Missing thumbnails get unique lightweight placeholders.
    image.onerror = () => {
        image.onerror = null;
        image.src = fallbackImage(background.folder);
    };

    const check = document.createElement("span");
    check.className = "thumb-check";
    check.textContent = "✓";
    check.setAttribute("aria-hidden", "true");

    picture.append(image, check);

    const label = document.createElement("span");
    label.className = "thumb-label";
    label.textContent = background.name;

    button.append(picture, label);
    button.addEventListener("click", () => selectBackground(index));

    cards.set(background.folder, button);
    return button;
}

function centerSelected() {
    const background = backgrounds[selectedIndex];
    const card = cards.get(background.folder);
    if (!card) return;
    const left = card.offsetLeft - track.offsetLeft
        - track.clientWidth / 2 + card.clientWidth / 2;
    track.scrollTo({ left, behavior: "smooth" });
}

function selectBackground(indexOrFolder) {
    if (!backgrounds.length) return;

    let index = typeof indexOrFolder === "number"
        ? indexOrFolder
        : backgrounds.findIndex(b => b.folder === indexOrFolder);

    if (index < 0 || index >= backgrounds.length) index = 0;

    selectedIndex = index;
    const background = backgrounds[index];
    const version = ++selectionVersion;
    const url = backgroundURL(background.folder);

    $("current-name").textContent = background.name;
    $("description").textContent = background.description || "";
    $("count").textContent = `${index + 1} / ${backgrounds.length}`;
    $("open-background").href = url;

    for (const [folder, button] of cards) {
        const active = folder === background.folder;
        button.classList.toggle("selected", active);
        button.setAttribute("aria-pressed", String(active));
    }

    try {
        localStorage.setItem(storageKey, background.folder);
    } catch {}

    const absoluteURL = new URL(url, document.baseURI).href;
    if (frame.src !== absoluteURL) {
        shade.classList.add("active");
        frame.onload = () => {
            if (version === selectionVersion) {
                shade.classList.remove("active");
            }
        };
        frame.title = `${background.name} animated background`;
        frame.src = url;
    }

    centerSelected();
}

function moveSelection(delta) {
    selectBackground(
        (selectedIndex + delta + backgrounds.length)
        % backgrounds.length
    );
}

function setGalleryVisible(visible) {
    dock.hidden = !visible;
    $("gallery-header").hidden = !visible;
    $("show-gallery").hidden = visible;
    if (!visible) setPopover(false);
    if (visible) requestAnimationFrame(centerSelected);
}

function setPopover(open) {
    popover.hidden = !open;
    $("settings").classList.toggle("active", open);
    $("settings").setAttribute("aria-expanded", String(open));
}

$("previous").onclick = () => moveSelection(-1);
$("next").onclick = () => moveSelection(1);
$("hide").onclick = () => setGalleryVisible(false);
$("show-gallery").onclick = () => setGalleryVisible(true);
$("settings").onclick = () => setPopover(popover.hidden);

$("scroll-left").onclick = () => track.scrollBy({
    left: -track.clientWidth * .7,
    behavior: "smooth"
});
$("scroll-right").onclick = () => track.scrollBy({
    left: track.clientWidth * .7,
    behavior: "smooth"
});

track.addEventListener("wheel", event => {
    if (track.scrollWidth <= track.clientWidth) return;
    track.scrollLeft += Math.abs(event.deltaX) > Math.abs(event.deltaY)
        ? event.deltaX : event.deltaY;
    event.preventDefault();
}, { passive: false });

document.addEventListener("pointerdown", event => {
    if (!popover.hidden &&
        !popover.contains(event.target) &&
        !$("settings").contains(event.target)) {
        setPopover(false);
    }
});

document.addEventListener("keydown", event => {
    if (event.key === "Escape") {
        if (!popover.hidden) setPopover(false);
        else setGalleryVisible(dock.hidden);
        return;
    }
    if (event.target.closest("button, a, input, textarea, select")) return;
    if (event.key === "ArrowLeft") moveSelection(-1);
    if (event.key === "ArrowRight") moveSelection(1);
});

/* ZIP writer: store entries without compression. */
function makeBackgroundZip(files) {
    const encoder = new TextEncoder();
    const parts = [], directory = [];
    let offset = 0, directorySize = 0;
    const now = new Date();
    const dosTime = (now.getHours() << 11) |
        (now.getMinutes() << 5) | (now.getSeconds() >> 1);
    const dosDate = ((Math.max(1980, now.getFullYear()) - 1980) << 9) |
        ((now.getMonth() + 1) << 5) | now.getDate();

    function crc32(bytes) {
        let crc = 0xffffffff;
        for (const byte of bytes) {
            crc ^= byte;
            for (let i = 0; i < 8; i++) {
                crc = (crc >>> 1) ^ ((crc & 1) ? 0xedb88320 : 0);
            }
        }
        return (crc ^ 0xffffffff) >>> 0;
    }

    for (const file of files) {
        const name = encoder.encode(file.name);
        const data = encoder.encode(file.text);
        const crc = crc32(data);
        const local = new Uint8Array(30 + name.length);
        const lv = new DataView(local.buffer);
        lv.setUint32(0, 0x04034b50, true);
        lv.setUint16(4, 20, true);
        lv.setUint16(6, 0x0800, true);
        lv.setUint16(10, dosTime, true);
        lv.setUint16(12, dosDate, true);
        lv.setUint32(14, crc, true);
        lv.setUint32(18, data.length, true);
        lv.setUint32(22, data.length, true);
        lv.setUint16(26, name.length, true);
        local.set(name, 30);
        parts.push(local, data);

        const central = new Uint8Array(46 + name.length);
        const cv = new DataView(central.buffer);
        cv.setUint32(0, 0x02014b50, true);
        cv.setUint16(4, 20, true);
        cv.setUint16(6, 20, true);
        cv.setUint16(8, 0x0800, true);
        cv.setUint16(12, dosTime, true);
        cv.setUint16(14, dosDate, true);
        cv.setUint32(16, crc, true);
        cv.setUint32(20, data.length, true);
        cv.setUint32(24, data.length, true);
        cv.setUint32(42, offset, true);
        central.set(name, 46);
        directory.push(central);
        directorySize += central.length;
        offset += local.length + data.length;
    }

    const end = new Uint8Array(22);
    const ev = new DataView(end.buffer);
    ev.setUint32(0, 0x06054b50, true);
    ev.setUint16(8, files.length, true);
    ev.setUint16(10, files.length, true);
    ev.setUint32(12, directorySize, true);
    ev.setUint32(16, offset, true);
    return new Blob([...parts, ...directory, end],
        { type: "application/zip" });
}

function applyDownloadedConfig(html, config) {
    const pattern = /\bconst\s+config\s*=\s*\{[\s\S]*?^\s*\};/gm;
    const matches = [...html.matchAll(pattern)];
    if (matches.length !== 1) {
        throw new Error("Could not locate exactly one config block.");
    }
    const match = matches[0];
    const serialized = JSON.stringify(config, null, 2)
        .replace(/</g, "\\u003c")
        .replace(/\u2028/g, "\\u2028")
        .replace(/\u2029/g, "\\u2029");
    return html.slice(0, match.index) +
        "const config = " + serialized + ";" +
        html.slice(match.index + match[0].length);
}

async function fetchSource(url) {
    const response = await fetch(url, { cache: "no-cache" });
    if (!response.ok) {
        throw new Error(`Could not fetch ${url.pathname}: ${response.status}`);
    }
    return response.text();
}

$("download").addEventListener("click", async () => {
    const button = $("download");
    button.disabled = true;
    button.textContent = "Preparing download…";
    $("status").textContent = "";

    try {
        if (!/^https?:$/.test(location.protocol)) {
            throw new Error("Open this gallery through a web server.");
        }

        const background = backgrounds[selectedIndex];
        const sourceURL = new URL(
            backgroundURL(background.folder), document.baseURI
        );
        const child = frame.contentWindow;

        if (child.location.href !== sourceURL.href ||
            typeof child.getBackgroundConfig !== "function") {
            throw new Error(
                "Background is not ready or does not expose getBackgroundConfig()."
            );
        }

        const config = JSON.parse(
            JSON.stringify(child.getBackgroundConfig())
        );

        if (config.panel && typeof config.panel === "object") {
            config.panel.enabled = $("editor-enabled").checked;
        }

        const [htmlSource, editorSource] = await Promise.all([
            fetchSource(sourceURL),
            fetchSource(new URL("settings-editor.js", sourceURL))
        ]);

        const html = applyDownloadedConfig(htmlSource, config);
        if (!/\bexport\b/.test(editorSource) ||
            /^\s*</.test(editorSource)) {
            throw new Error("Could not retrieve the settings editor.");
        }

        const zip = makeBackgroundZip([
            { name: "index.html", text: html },
            { name: "settings-editor.js", text: editorSource }
        ]);

        const blobURL = URL.createObjectURL(zip);
        const link = document.createElement("a");
        link.href = blobURL;
        link.download =
            `${background.folder.split("/").pop()}-custom.zip`;
        document.body.append(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(blobURL), 60000);
        $("status").textContent = "Background ZIP prepared.";
    } catch (error) {
        $("status").textContent = error.message;
    } finally {
        button.disabled = false;
        button.textContent = "Download background ZIP ↓";
    }
});

if (backgrounds.length) {
    backgrounds.forEach((background, index) => {
        track.append(makeCard(background, index));
    });

    let saved = null;
    try { saved = localStorage.getItem(storageKey); } catch {}
    selectBackground(saved);

    requestAnimationFrame(centerSelected);
} else {
    $("current-name").textContent = "No backgrounds found";
}
</script>
</body>
</html>
