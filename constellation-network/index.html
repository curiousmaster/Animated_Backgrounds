<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Constellation Network — 3D WebGL</title>

<style>
    html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
    }

    #background {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
    }

    #error {
        position: fixed;
        top: 20px;
        left: 20px;
        max-width: min(500px, calc(100vw - 80px));
        padding: 16px;
        color: #fff;
        background: #28131b;
        border: 1px solid #aa5267;
        border-radius: 8px;
        font: 14px/1.5 system-ui, sans-serif;
        z-index: 2000;
    }

    [hidden] {
        display: none !important;
    }
</style>
</head>

<body>
<canvas id="background" aria-hidden="true"></canvas>
<div id="error" role="alert" hidden></div>

<script type="module">
"use strict";

const config = {
    points: {
        count: 1120,
        radius: 1.8,
        speed: 20,
        opacity: 0.9,
        color: [160, 210, 255]
    },

    connections: {
        distance: 150,
        lineWidth: 0.8,
        opacity: 0.35,
        color: [80, 160, 255]
    },

    mouse: {
        enabled: true,
        radius: 230,
        lineWidth: 1,
        opacity: 0.7,
        showPoint: true,
        pointRadius: 3,
        smoothing: 12,
        color: [255, 100, 180]
    },

    glow: {
        enabled: true,
        intensity: 0.6,
        blur: 10
    },

    view: {
        mode: "3d",
        depth: 650,
        zoom: 1,
        wheelSensitivity: 1,
        perspective: 0.65,
        parallax: 0.45,
        depthFading: 0.65
    },

    panel: {
        enabled: true
    }
};

window.getBackgroundConfig = () =>
    JSON.parse(JSON.stringify(config));

const canvas = document.getElementById("background");
const errorBox = document.getElementById("error");

const clamp = (v, min, max) => Math.max(min, Math.min(max, v));
const lerp = (a, b, t) => a + (b - a) * t;
const TAU = Math.PI * 2;

const MIN_ZOOM = 0.35;
const MAX_ZOOM = 3;

let gl;
let renderer;
let width = 1;
let height = 1;
let points = [];
let frameId = 0;
let previousTime = null;
let contextLost = false;
let editor = null;

const camera = {
    depthMix: config.view.mode === "3d" ? 1 : 0,
    zoom: config.view.zoom,
    yaw: 0,
    pitch: 0,
    focal: 1,
    distance: 1,
    cy: 1,
    sy: 0,
    cx: 1,
    sx: 0,
    effectiveDepth: 0
};

const mouse = {
    x: 0,
    y: 0,
    targetX: 0,
    targetY: 0,
    active: false,
    initialized: false,
    influence: 0,
    worldX: 0,
    worldY: 0,
    worldZ: 0
};

function showError(message) {
    errorBox.textContent = message;
    errorBox.hidden = false;
}

// --------------------------------------------------
// WebGL rendering
//
// Geometry is projected from 3D in JavaScript.
// WebGL renders the resulting lines and circles as
// instanced, antialiased quads with shader glow.
// --------------------------------------------------

const vertexSource = `#version 300 es
precision highp float;

layout(location = 0) in vec4 a_segment;
layout(location = 1) in vec2 a_radii;
layout(location = 2) in vec4 a_color;

uniform vec2 u_resolution;
uniform float u_blur;
uniform float u_intensity;

out vec2 v_local;
flat out float v_length;
flat out vec2 v_radii;
flat out vec4 v_color;

const vec2 CORNERS[6] = vec2[6](
    vec2(0.0, -1.0),
    vec2(1.0, -1.0),
    vec2(0.0, 1.0),
    vec2(0.0, 1.0),
    vec2(1.0, -1.0),
    vec2(1.0, 1.0)
);

void main() {
    vec2 start = a_segment.xy;
    vec2 end = a_segment.zw;
    vec2 difference = end - start;

    float segmentLength = length(difference);

    vec2 direction = segmentLength > 0.0001
        ? difference / segmentLength
        : vec2(1.0, 0.0);

    vec2 normal = vec2(-direction.y, direction.x);

    float halo = u_intensity > 0.0 ? u_blur * 2.5 : 0.0;
    float padding = max(a_radii.x, a_radii.y) + halo + 1.5;

    vec2 corner = CORNERS[gl_VertexID];

    vec2 local = vec2(
        mix(-padding, segmentLength + padding, corner.x),
        corner.y * padding
    );

    vec2 position =
        start + direction * local.x + normal * local.y;

    vec2 clip = position / u_resolution * 2.0 - 1.0;
    gl_Position = vec4(clip.x, -clip.y, 0.0, 1.0);

    v_local = local;
    v_length = segmentLength;
    v_radii = a_radii;
    v_color = a_color;
}
`;

const fragmentSource = `#version 300 es
precision highp float;

in vec2 v_local;
flat in float v_length;
flat in vec2 v_radii;
flat in vec4 v_color;

uniform float u_blur;
uniform float u_intensity;

out vec4 outColor;

void main() {
    float along = clamp(v_local.x, 0.0, v_length);

    float t = v_length > 0.0001
        ? along / v_length
        : 0.0;

    float radius = mix(v_radii.x, v_radii.y, t);

    float edge =
        length(v_local - vec2(along, 0.0)) - radius;

    float aa = max(fwidth(edge), 0.0001);

    float coverage = 1.0 - smoothstep(
        -aa * 0.5, aa * 0.5, edge
    );

    float core = v_color.a * coverage;
    float glow = 0.0;

    if (u_intensity > 0.0) {
        if (u_blur > 0.0) {
            float outside = max(edge, 0.0);
            float sigma = max(u_blur * 0.5, 0.001);

            float halo = exp(
                -0.5 * outside * outside / (sigma * sigma)
            );

            float cutoff = 1.0 - smoothstep(
                u_blur * 2.0,
                u_blur * 2.5,
                outside
            );

            glow = v_color.a * u_intensity * halo * cutoff;
        } else {
            glow = v_color.a * u_intensity * coverage;
        }
    }

    float alpha = core + glow * (1.0 - core);

    if (alpha < 0.0001) discard;

    outColor = vec4(v_color.rgb * alpha, alpha);
}
`;

function compileShader(type, source) {
    const shader = gl.createShader(type);
    if (!shader) throw new Error("Could not create shader.");

    gl.shaderSource(shader, source);
    gl.compileShader(shader);

    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
        const message = gl.getShaderInfoLog(shader);
        gl.deleteShader(shader);
        throw new Error(message || "Shader compilation failed.");
    }

    return shader;
}

function createProgram() {
    const vertex = compileShader(gl.VERTEX_SHADER, vertexSource);
    let fragment;
    let program;

    try {
        fragment = compileShader(
            gl.FRAGMENT_SHADER,
            fragmentSource
        );

        program = gl.createProgram();
        if (!program) throw new Error("Could not create program.");

        gl.attachShader(program, vertex);
        gl.attachShader(program, fragment);
        gl.linkProgram(program);

        if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
            throw new Error(
                gl.getProgramInfoLog(program) ||
                "Shader linking failed."
            );
        }

        return program;
    } catch (error) {
        if (program) gl.deleteProgram(program);
        throw error;
    } finally {
        gl.deleteShader(vertex);
        if (fragment) gl.deleteShader(fragment);
    }
}

class Renderer {
    constructor() {
        this.program = createProgram();
        this.vao = gl.createVertexArray();
        this.buffer = gl.createBuffer();

        // endpoints: 4, radii: 2, RGBA: 4
        this.stride = 10;
        this.capacity = 4096;
        this.data = new Float32Array(
            this.capacity * this.stride
        );
        this.count = 0;
        this.gpuBytes = 0;

        this.resolution = gl.getUniformLocation(
            this.program, "u_resolution"
        );
        this.blur = gl.getUniformLocation(
            this.program, "u_blur"
        );
        this.intensity = gl.getUniformLocation(
            this.program, "u_intensity"
        );

        gl.bindVertexArray(this.vao);
        gl.bindBuffer(gl.ARRAY_BUFFER, this.buffer);

        const bytes = this.stride * 4;

        gl.enableVertexAttribArray(0);
        gl.vertexAttribPointer(0, 4, gl.FLOAT, false, bytes, 0);
        gl.vertexAttribDivisor(0, 1);

        gl.enableVertexAttribArray(1);
        gl.vertexAttribPointer(1, 2, gl.FLOAT, false, bytes, 16);
        gl.vertexAttribDivisor(1, 1);

        gl.enableVertexAttribArray(2);
        gl.vertexAttribPointer(2, 4, gl.FLOAT, false, bytes, 24);
        gl.vertexAttribDivisor(2, 1);

        gl.bindVertexArray(null);
    }

    begin() {
        this.count = 0;
    }

    add(x1, y1, x2, y2, r1, r2, color, opacity) {
        if (opacity <= 0 || Math.max(r1, r2) <= 0) return;

        // Skip shapes entirely outside the viewport.
        const padding = Math.max(r1, r2) +
            (config.glow.enabled ? config.glow.blur * 2.5 : 0) +
            2;

        if (
            Math.max(x1, x2) < -padding ||
            Math.min(x1, x2) > width + padding ||
            Math.max(y1, y2) < -padding ||
            Math.min(y1, y2) > height + padding
        ) {
            return;
        }

        if (this.count >= this.capacity) {
            this.capacity *= 2;

            const next = new Float32Array(
                this.capacity * this.stride
            );

            next.set(this.data);
            this.data = next;
        }

        let i = this.count * this.stride;

        this.data[i++] = x1;
        this.data[i++] = y1;
        this.data[i++] = x2;
        this.data[i++] = y2;
        this.data[i++] = r1;
        this.data[i++] = r2;
        this.data[i++] = clamp(color[0] / 255, 0, 1);
        this.data[i++] = clamp(color[1] / 255, 0, 1);
        this.data[i++] = clamp(color[2] / 255, 0, 1);
        this.data[i++] = clamp(opacity, 0, 1);

        this.count++;
    }

    point(point, radius, color, opacity) {
        const size = radius * point.scale;

        this.add(
            point.screenX, point.screenY,
            point.screenX, point.screenY,
            size, size,
            color,
            opacity
        );
    }

    line(a, b, lineWidth, color, opacity) {
        this.add(
            a.screenX, a.screenY,
            b.screenX, b.screenY,
            lineWidth * 0.5 * a.scale,
            lineWidth * 0.5 * b.scale,
            color,
            opacity
        );
    }

    render() {
        gl.viewport(0, 0, canvas.width, canvas.height);
        gl.disable(gl.DEPTH_TEST);
        gl.disable(gl.CULL_FACE);

        gl.clearColor(0, 0, 0, 1);
        gl.clear(gl.COLOR_BUFFER_BIT);

        if (!this.count) return;

        gl.enable(gl.BLEND);
        gl.blendEquation(gl.FUNC_ADD);
        gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);

        gl.useProgram(this.program);
        gl.bindVertexArray(this.vao);
        gl.bindBuffer(gl.ARRAY_BUFFER, this.buffer);

        if (this.gpuBytes !== this.data.byteLength) {
            gl.bufferData(
                gl.ARRAY_BUFFER,
                this.data.byteLength,
                gl.DYNAMIC_DRAW
            );

            this.gpuBytes = this.data.byteLength;
        }

        gl.bufferSubData(
            gl.ARRAY_BUFFER,
            0,
            this.data.subarray(0, this.count * this.stride)
        );

        gl.uniform2f(this.resolution, width, height);
        gl.uniform1f(this.blur, Math.max(0, config.glow.blur));
        gl.uniform1f(
            this.intensity,
            config.glow.enabled
                ? clamp(config.glow.intensity, 0, 1)
                : 0
        );

        gl.drawArraysInstanced(
            gl.TRIANGLES,
            0,
            6,
            this.count
        );

        gl.bindVertexArray(null);
    }
}

// --------------------------------------------------
// Points
//
// z is normalized to -0.5 ... +0.5.
// Depth can therefore change without resetting points.
// --------------------------------------------------

function createPoint() {
    const angle = Math.random() * TAU;
    const vertical = Math.random() * 1.4 - 0.7;
    const horizontal = Math.sqrt(1 - vertical * vertical);

    return {
        x: (Math.random() - 0.5) * width,
        y: (Math.random() - 0.5) * height,
        z: Math.random() - 0.5,

        dx: Math.cos(angle) * horizontal,
        dy: Math.sin(angle) * horizontal,
        dz: vertical,

        speedFactor: 0.5 + Math.random(),

        worldZ: 0,
        viewZ: 0,
        screenX: 0,
        screenY: 0,
        scale: 1,
        fade: 1
    };
}

function syncPoints() {
    const count = Math.max(0, Math.floor(config.points.count));

    while (points.length < count) {
        points.push(createPoint());
    }

    points.length = count;
}

function resetPoints() {
    points = [];
    syncPoints();
}

function resize() {
    const oldWidth = width;
    const oldHeight = height;

    width = Math.max(1, window.innerWidth);
    height = Math.max(1, window.innerHeight);

    let dpr = Math.min(window.devicePixelRatio || 1, 2);

    if (gl && !contextLost) {
        const viewport = gl.getParameter(gl.MAX_VIEWPORT_DIMS);
        const bufferSize = gl.getParameter(gl.MAX_RENDERBUFFER_SIZE);

        dpr = Math.min(
            dpr,
            viewport[0] / width,
            viewport[1] / height,
            bufferSize / width,
            bufferSize / height
        );
    }

    const pixelWidth = Math.max(1, Math.floor(width * dpr));
    const pixelHeight = Math.max(1, Math.floor(height * dpr));

    if (
        canvas.width !== pixelWidth ||
        canvas.height !== pixelHeight
    ) {
        canvas.width = pixelWidth;
        canvas.height = pixelHeight;
    }

    for (const point of points) {
        point.x *= width / oldWidth;
        point.y *= height / oldHeight;
    }

    mouse.x *= width / oldWidth;
    mouse.targetX *= width / oldWidth;
    mouse.y *= height / oldHeight;
    mouse.targetY *= height / oldHeight;
}

function updatePoints(delta) {
    const speed = Math.max(0, config.points.speed);
    const halfWidth = width * 0.5;
    const halfHeight = height * 0.5;
    const depth = Math.max(1, config.view.depth);

    for (const point of points) {
        const movement = speed * point.speedFactor * delta;

        point.x += point.dx * movement;
        point.y += point.dy * movement;

        // Stop depth movement once the field is flat.
        point.z +=
            point.dz * movement / depth * camera.depthMix;

        if (point.x < -halfWidth) {
            point.x = -halfWidth;
            point.dx = Math.abs(point.dx);
        } else if (point.x > halfWidth) {
            point.x = halfWidth;
            point.dx = -Math.abs(point.dx);
        }

        if (point.y < -halfHeight) {
            point.y = -halfHeight;
            point.dy = Math.abs(point.dy);
        } else if (point.y > halfHeight) {
            point.y = halfHeight;
            point.dy = -Math.abs(point.dy);
        }

        if (point.z < -0.5) {
            point.z = -0.5;
            point.dz = Math.abs(point.dz);
        } else if (point.z > 0.5) {
            point.z = 0.5;
            point.dz = -Math.abs(point.dz);
        }
    }
}

// --------------------------------------------------
// Camera and projection
// --------------------------------------------------

function updateCamera(delta) {
    const response = 1 - Math.exp(-7 * delta);
    const targetMix = config.view.mode === "3d" ? 1 : 0;

    camera.depthMix = lerp(
        camera.depthMix,
        targetMix,
        response
    );

    if (Math.abs(camera.depthMix - targetMix) < 0.0001) {
        camera.depthMix = targetMix;
    }

    camera.zoom = lerp(
        camera.zoom,
        clamp(config.view.zoom, MIN_ZOOM, MAX_ZOOM),
        response
    );

    const pointerX = mouse.initialized
        ? clamp(mouse.x / width * 2 - 1, -1, 1)
        : 0;

    const pointerY = mouse.initialized
        ? clamp(mouse.y / height * 2 - 1, -1, 1)
        : 0;

    const parallax =
        clamp(config.view.parallax, 0, 1) *
        camera.depthMix *
        mouse.influence *
        0.28;

    camera.yaw = lerp(
        camera.yaw,
        pointerX * parallax,
        response
    );

    camera.pitch = lerp(
        camera.pitch,
        -pointerY * parallax,
        response
    );

    camera.cy = Math.cos(camera.yaw);
    camera.sy = Math.sin(camera.yaw);
    camera.cx = Math.cos(camera.pitch);
    camera.sx = Math.sin(camera.pitch);

    camera.effectiveDepth =
        Math.max(0, config.view.depth) * camera.depthMix;

    const span = Math.max(width, height);

    // Lower focal length produces stronger perspective.
    camera.focal = span * lerp(
        2.8,
        1,
        clamp(config.view.perspective, 0, 1)
    );

    // Exact bound for the rotated box along the camera Z axis.
    // Keeping the camera beyond this bound prevents clipping
    // through the field at maximum zoom.
    const frontBound =
        Math.abs(camera.sy * camera.cx) * width * 0.5 +
        Math.abs(camera.sx) * height * 0.5 +
        Math.abs(camera.cy * camera.cx) *
            camera.effectiveDepth * 0.5;

    camera.distance =
        camera.focal / camera.zoom + frontBound;
}

function projectPoints() {
    const {
        cy, sy, cx, sx,
        focal, distance,
        effectiveDepth
    } = camera;

    const fading =
        clamp(config.view.depthFading, 0, 1) *
        camera.depthMix;

    // Rotated depth range, including parallax.
    const depthBound = Math.max(
        1,
        Math.abs(sy * cx) * width * 0.5 +
        Math.abs(sx) * height * 0.5 +
        Math.abs(cy * cx) * effectiveDepth * 0.5
    );

    for (const point of points) {
        const z = point.z * effectiveDepth;
        point.worldZ = z;

        // Yaw, followed by pitch.
        const rotatedX = cy * point.x + sy * z;
        const intermediateZ = -sy * point.x + cy * z;

        const rotatedY = cx * point.y - sx * intermediateZ;
        const rotatedZ = sx * point.y + cx * intermediateZ;

        const scale = focal / Math.max(1, distance - rotatedZ);

        point.viewZ = rotatedZ;
        point.scale = scale;
        point.screenX = width * 0.5 + rotatedX * scale;
        point.screenY = height * 0.5 + rotatedY * scale;

        const farAmount = clamp(
            (depthBound - rotatedZ) / (depthBound * 2),
            0,
            1
        );

        point.fade = 1 - fading * farAmount;
    }

    // Place the cursor node on the camera-facing plane
    // passing through the center of the field.
    const viewX =
        (mouse.x - width * 0.5) * distance / focal;

    const viewY =
        (mouse.y - height * 0.5) * distance / focal;

    // Inverse pitch, then inverse yaw.
    const intermediateY = cx * viewY;
    const intermediateZ = -sx * viewY;

    mouse.worldX = cy * viewX - sy * intermediateZ;
    mouse.worldY = intermediateY;
    mouse.worldZ = sy * viewX + cy * intermediateZ;
}

// --------------------------------------------------
// Nearby connections: 3D spatial hash
// --------------------------------------------------

const buckets = new Map();
const bucketPool = [];

function gridKey(x, y, z) {
    return `${x},${y},${z}`;
}

function buildConnections() {
    const settings = config.connections;
    const distance = Math.max(0, settings.distance);

    if (
        distance <= 0 ||
        settings.lineWidth <= 0 ||
        settings.opacity <= 0
    ) {
        return;
    }

    for (const bucket of buckets.values()) {
        bucket.length = 0;
        bucketPool.push(bucket);
    }

    buckets.clear();

    for (let index = 0; index < points.length; index++) {
        const point = points[index];

        point.cellX = Math.floor(point.x / distance);
        point.cellY = Math.floor(point.y / distance);
        point.cellZ = Math.floor(point.worldZ / distance);

        const key = gridKey(
            point.cellX,
            point.cellY,
            point.cellZ
        );

        let bucket = buckets.get(key);

        if (!bucket) {
            bucket = bucketPool.pop() || [];
            buckets.set(key, bucket);
        }

        bucket.push(index);
    }

    const squaredLimit = distance * distance;
    const flat = camera.effectiveDepth === 0;

    for (let index = 0; index < points.length; index++) {
        const point = points[index];

        for (let oz = flat ? 0 : -1; oz <= (flat ? 0 : 1); oz++) {
            for (let oy = -1; oy <= 1; oy++) {
                for (let ox = -1; ox <= 1; ox++) {
                    const bucket = buckets.get(gridKey(
                        point.cellX + ox,
                        point.cellY + oy,
                        point.cellZ + oz
                    ));

                    if (!bucket) continue;

                    for (const otherIndex of bucket) {
                        if (otherIndex <= index) continue;

                        const other = points[otherIndex];

                        const dx = point.x - other.x;
                        const dy = point.y - other.y;
                        const dz = point.worldZ - other.worldZ;
                        const squared = dx * dx + dy * dy + dz * dz;

                        if (squared >= squaredLimit) continue;

                        const strength =
                            1 - Math.sqrt(squared) / distance;

                        renderer.line(
                            point,
                            other,
                            settings.lineWidth,
                            settings.color,
                            settings.opacity *
                                strength *
                                Math.sqrt(point.fade * other.fade)
                        );
                    }
                }
            }
        }
    }
}

// --------------------------------------------------
// Mouse connections and points
// --------------------------------------------------

function mouseAmount(point) {
    if (
        !config.mouse.enabled ||
        mouse.influence < 0.001 ||
        config.mouse.radius <= 0
    ) {
        return 0;
    }

    const distance = Math.hypot(
        point.x - mouse.worldX,
        point.y - mouse.worldY,
        point.worldZ - mouse.worldZ
    );

    return mouse.influence * Math.max(
        0,
        1 - distance / config.mouse.radius
    );
}

const cursorNode = {
    screenX: 0,
    screenY: 0,
    scale: 1
};

function buildMouseConnections() {
    const settings = config.mouse;

    if (!settings.enabled || mouse.influence < 0.001) return;

    cursorNode.screenX = mouse.x;
    cursorNode.screenY = mouse.y;
    cursorNode.scale = camera.focal / camera.distance;

    for (const point of points) {
        const amount = mouseAmount(point);
        if (amount <= 0) continue;

        renderer.line(
            cursorNode,
            point,
            settings.lineWidth,
            settings.color,
            settings.opacity * amount * point.fade
        );
    }

    if (settings.showPoint) {
        renderer.point(
            cursorNode,
            settings.pointRadius,
            settings.color,
            settings.opacity * mouse.influence
        );
    }
}

const mixedColor = [0, 0, 0];
const orderedPoints = [];

function buildPoints() {
    const settings = config.points;

    if (settings.radius <= 0 || settings.opacity <= 0) return;

    // Painter's order for translucent points: far to near.
    orderedPoints.length = points.length;

    for (let i = 0; i < points.length; i++) {
        orderedPoints[i] = points[i];
    }

    if (camera.depthMix > 0) {
        orderedPoints.sort((a, b) => a.viewZ - b.viewZ);
    }

    for (const point of orderedPoints) {
        const amount = mouseAmount(point);

        for (let channel = 0; channel < 3; channel++) {
            mixedColor[channel] = lerp(
                settings.color[channel],
                config.mouse.color[channel],
                amount
            );
        }

        renderer.point(
            point,
            settings.radius,
            mixedColor,
            settings.opacity * point.fade
        );
    }
}

// --------------------------------------------------
// Animation
// --------------------------------------------------

function animate(timestamp) {
    frameId = 0;

    if (contextLost || document.hidden || !renderer) return;

    const delta = previousTime === null
        ? 0
        : clamp((timestamp - previousTime) / 1000, 0, 0.05);

    previousTime = timestamp;

    const smoothing =
        1 - Math.exp(-Math.max(0.1, config.mouse.smoothing) * delta);

    mouse.x = lerp(mouse.x, mouse.targetX, smoothing);
    mouse.y = lerp(mouse.y, mouse.targetY, smoothing);

    // Parallax remains available even if mouse connections
    // are disabled.
    mouse.influence = lerp(
        mouse.influence,
        mouse.active ? 1 : 0,
        smoothing
    );

    updateCamera(delta);
    updatePoints(delta);
    projectPoints();

    renderer.begin();
    buildConnections();
    buildMouseConnections();
    buildPoints();
    renderer.render();

    frameId = requestAnimationFrame(animate);
}

function startAnimation() {
    if (frameId || contextLost || document.hidden || !renderer) {
        return;
    }

    previousTime = null;
    frameId = requestAnimationFrame(animate);
}

function stopAnimation() {
    cancelAnimationFrame(frameId);
    frameId = 0;
    previousTime = null;
}

// --------------------------------------------------
// Pointer and wheel
// --------------------------------------------------

function isEditorTarget(target) {
    return target instanceof Element &&
        Boolean(target.closest("[data-background-editor]"));
}

function updateMouse(event) {
    if (isEditorTarget(event.target)) {
        mouse.active = false;
        return;
    }

    mouse.targetX = event.clientX;
    mouse.targetY = event.clientY;
    mouse.active = true;

    if (!mouse.initialized) {
        mouse.x = mouse.targetX;
        mouse.y = mouse.targetY;
        mouse.initialized = true;
    }
}

function deactivateMouse() {
    mouse.active = false;
}

window.addEventListener("pointermove", updateMouse);
window.addEventListener("pointerdown", updateMouse);

document.documentElement.addEventListener(
    "pointerleave",
    deactivateMouse
);

window.addEventListener("blur", deactivateMouse);
window.addEventListener("pointercancel", deactivateMouse);

window.addEventListener("pointerup", event => {
    if (event.pointerType !== "mouse") deactivateMouse();
});

window.addEventListener("wheel", event => {
    if (isEditorTarget(event.target)) return;

    // Preserve browser Ctrl+wheel / trackpad pinch behavior.
    if (event.ctrlKey) return;

    event.preventDefault();

    const units = event.deltaMode === 1
        ? 16
        : event.deltaMode === 2
            ? height
            : 1;

    const delta = clamp(event.deltaY * units, -300, 300);
    const sensitivity = Math.max(0, config.view.wheelSensitivity);

    config.view.zoom = clamp(
        config.view.zoom * Math.exp(-delta * sensitivity * 0.0015),
        MIN_ZOOM,
        MAX_ZOOM
    );

    editor?.refresh();
}, { passive: false });

function resetView() {
    config.view.zoom = 1;

    mouse.active = false;
    mouse.initialized = false;
    mouse.influence = 0;
    mouse.x = mouse.targetX = width * 0.5;
    mouse.y = mouse.targetY = height * 0.5;

    editor?.refresh();
}

document.addEventListener("visibilitychange", () => {
    deactivateMouse();

    if (document.hidden) {
        stopAnimation();
    } else {
        resize();
        startAnimation();
    }
});

window.addEventListener("resize", resize);

// --------------------------------------------------
// Context lifecycle
// --------------------------------------------------

canvas.addEventListener("webglcontextlost", event => {
    event.preventDefault();
    contextLost = true;
    stopAnimation();

    showError(
        "WebGL was interrupted. Waiting for the browser to restore it…"
    );
});

canvas.addEventListener("webglcontextrestored", () => {
    contextLost = false;

    try {
        renderer = new Renderer();
        resize();
        errorBox.hidden = true;
        startAnimation();
    } catch (error) {
        console.error(error);
        showError(error.message);
    }
});

// --------------------------------------------------
// Initialization
// --------------------------------------------------

try {
    gl = canvas.getContext("webgl2", {
        alpha: false,
        antialias: false,
        depth: false,
        stencil: false,
        preserveDrawingBuffer: false,
        powerPreference: "high-performance"
    });

    if (!gl) {
        throw new Error(
            "WebGL2 is unavailable. Enable browser hardware " +
            "acceleration and reload this page."
        );
    }

    renderer = new Renderer();

    resize();

    mouse.x = mouse.targetX = width * 0.5;
    mouse.y = mouse.targetY = height * 0.5;

    syncPoints();
    startAnimation();
} catch (error) {
    console.error(error);
    showError(error.message);
}

if (config.panel.enabled) {
    // Increment this version when publishing editor changes.
    import("./settings-editor.js??v=${Date.now()}")
        .then(({ mountEditor }) => {
            editor = mountEditor({
                config,

                onChange(path) {
                    if (path === "points.count") syncPoints();
                    deactivateMouse();
                },

                onReset: resetPoints,
                onResetView: resetView
            });
        })
        .catch(error => {
            console.error("Could not load settings editor:", error);
        });
}
</script>
</body>
</html>
